<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>간사이 일본어 스피킹 코치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: 역 안내판 스타일. 한 주 = 한 노선, 하루 = 한 정거장. 상단 남색 띠 + 흰 종이 카드. */
:root{
  --bg:#eef1f5; --paper:#ffffff; --paper2:#f6f8fb; --ink:#0f1b2d; --mute:#5a6678; --line:#d6dde7;
  --band:#13233f; --bandink:#ffffff; --accent:#0b63c8; --accentink:#ffffff;
  --ok:#14804a; --okbg:#e3f5ea; --near:#9a6400; --nearbg:#fff1d6; --bad:#c42b2b; --badbg:#fde5e5;
  --focus:#0b63c8; --shadow:0 1px 2px rgba(15,27,45,.08),0 4px 14px rgba(15,27,45,.06);
  --f-body:"Noto Sans KR","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans CJK JP","Noto Sans KR",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1220; --paper:#121c2f; --paper2:#182440; --ink:#e7edf7; --mute:#9aa8bd; --line:#26344d;
  --band:#0d1a31; --bandink:#ffffff; --accent:#5aa2ff; --accentink:#06142b;
  --ok:#53d08a; --okbg:#123223; --near:#f0b44c; --nearbg:#3a2c0e; --bad:#ff8a8a; --badbg:#3c1717; --focus:#5aa2ff; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1220; --paper:#121c2f; --paper2:#182440; --ink:#e7edf7; --mute:#9aa8bd; --line:#26344d;
  --band:#0d1a31; --bandink:#ffffff; --accent:#5aa2ff; --accentink:#06142b;
  --ok:#53d08a; --okbg:#123223; --near:#f0b44c; --nearbg:#3a2c0e; --bad:#ff8a8a; --badbg:#3c1717; --focus:#5aa2ff; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;-webkit-text-size-adjust:100%}
.jp,ruby,rt{font-family:var(--f-jp)}
rt{font-size:.5em;font-weight:500;color:var(--mute)}
body.noruby rt{display:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
/* top band */
.top{position:sticky;top:0;z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--band);color:var(--bandink)}
.top .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;color:inherit;padding:0;text-align:left}
.brand b{font-family:var(--f-jp);font-weight:900;font-size:20px;letter-spacing:.02em}
.brand span{font-size:12px;opacity:.75}
.top .sp{flex:1}
.pill{font-family:var(--f-mono);font-size:12px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;white-space:nowrap}
.tbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:inherit;border-radius:8px;padding:4px 10px;font-size:13px}
.tbtn:hover{background:rgba(255,255,255,.12)}
/* generic */
h1,h2,h3{font-family:var(--f-jp);margin:0;text-wrap:balance}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--mute)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;line-height:1.3;min-height:36px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accentink);font-weight:700}
.btn.rec{border-color:var(--bad);color:var(--bad)}
.btn.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.notice{border:1px solid var(--near);background:var(--nearbg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13.5px}
/* home */
.hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin:18px 0 6px}
.hero h1{font-size:26px;line-height:1.25}
.hero p{margin:4px 0 0}
.dday{font-family:var(--f-mono);text-align:right}
.dday b{display:block;font-size:34px;line-height:1;letter-spacing:-.02em}
.today{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.today h2{font-size:18px}
.line{margin-top:16px}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.lbadge{color:#fff;font-weight:700;font-size:12.5px;border-radius:999px;padding:1px 10px}
.lname{font-weight:700;font-size:14px}
.lcnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.stations{position:relative;display:flex;flex-wrap:wrap;row-gap:14px}
.st{position:relative;flex:0 0 calc(100%/7);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;min-width:0}
.st::before{content:"";position:absolute;top:17px;left:0;right:0;height:6px;background:var(--lc);opacity:.9}
.st.first::before{left:50%}.st.last::before{right:50%}
.dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:var(--paper);border:3px solid var(--lc);display:grid;place-items:center;font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--ink)}
.st.done .dot{background:var(--lc);color:#fff}
.st.cur .dot{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--lc)}
.st .lbl{font-size:10.5px;color:var(--mute);line-height:1.2;text-align:center;max-width:100%;padding:0 1px;word-break:keep-all;overflow-wrap:anywhere}
.st .dt{font-family:var(--f-mono);font-size:10px;color:var(--mute)}
.st:hover .dot{transform:scale(1.07)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:12px}
/* settings */
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px;align-items:center}
.set label{display:flex;gap:8px;align-items:center;font-size:14px}
.set input[type=range]{flex:1;min-width:80px}
.set select{max-width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px}
/* day */
.dayhead{margin:16px 0 10px}
.dayhead .crumb{font-family:var(--f-mono);font-size:12.5px;color:var(--mute);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dayhead .tag{color:#fff;border-radius:4px;padding:0 7px;font-weight:500}
.dayhead h1{font-size:22px;line-height:1.3;margin-top:4px}
.dayhead .goal{margin:6px 0 0;color:var(--mute)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.steps button{flex:0 0 auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;white-space:nowrap}
.steps button[aria-selected=true]{background:var(--band);border-color:var(--band);color:var(--bandink);font-weight:700}
.steps .t{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:18px;flex-wrap:wrap}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 4px}
.sh h2{font-size:17px}
/* phrase rows */
.prow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0;padding-top:0}
.ptag{font-family:var(--f-mono);font-size:11.5px;color:var(--mute)}
.pjp{font-family:var(--f-jp);font-size:19px;line-height:2.1;font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.pko{color:var(--mute);font-size:14px}
body.hideko .pko .kt{filter:blur(6px);cursor:pointer;transition:filter .15s}
body.hideko .pko .kt.show{filter:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.best{margin-left:auto;font-family:var(--f-mono);font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.best.ok{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.best.near{color:var(--near);border-color:var(--near);background:var(--nearbg)}
.res{border-radius:8px;padding:8px 10px;font-size:14px;margin-top:2px}
.res[hidden]{display:none}
.res.ok{background:var(--okbg)}.res.near{background:var(--nearbg)}.res.bad{background:var(--badbg)}.res.info{background:var(--paper2);border:1px solid var(--line)}
.res .sc{font-family:var(--f-mono);font-weight:500}
.res .diff{font-family:var(--f-jp);font-size:16px;margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}
.res .diff .miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px;font-weight:700}
.res .heard{font-family:var(--f-jp);color:var(--mute);margin-top:2px;overflow-wrap:anywhere}
/* md */
.md p{margin:.4em 0}.md ul,.md ol{margin:.4em 0;padding-left:1.3em}.md li{margin:.25em 0}
.md table{border-collapse:collapse;width:100%;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;line-height:1.9}
.md th{background:var(--paper2)}
.tw{overflow-x:auto;max-width:100%}
.md .jpx{font-family:var(--f-jp)}
/* writing */
.wq{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.wq:first-of-type{border-top:0}
.wq .q{font-family:var(--f-jp);font-size:18px;line-height:2.1}
.wq input[type=text],.wq textarea{font:inherit;font-family:var(--f-jp);background:var(--paper2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.blank{width:7em;text-align:center;font-size:17px}
.wq textarea{width:100%;min-height:48px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-jp);font-size:17px;background:var(--paper);border:1px solid var(--accent);border-radius:8px;padding:4px 10px}
.chip.used{opacity:.3;border-style:dashed}
.built{min-height:44px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:2px dashed var(--line);border-radius:8px;padding:6px}
.built .chip{background:var(--accent);color:var(--accentink)}
.verdict{font-size:14px;font-weight:700}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.ans{font-family:var(--f-jp);font-size:17px;background:var(--okbg);border-radius:8px;padding:6px 10px;line-height:2}
/* roleplay */
.chat{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.scene{font-family:var(--f-mono);font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px}
.bub{max-width:88%;border-radius:12px;padding:8px 12px;font-family:var(--f-jp);font-size:17px;line-height:2;overflow-wrap:anywhere}
.bub small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--mute);line-height:1.4}
.bub.staff{align-self:flex-start;background:var(--paper2);border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accentink)}
.bub.me small{color:inherit;opacity:.8}
.bub.me.pass{background:var(--ok);color:#fff}
.bub .hint{font-family:var(--f-body);font-size:15px}
.cta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--accent)}
details.ansbox{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--paper)}
details.ansbox summary{cursor:pointer;font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.quiz .qq{display:flex;flex-direction:column;gap:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.hero{grid-template-columns:1fr}.dday{text-align:left}.dday b{display:inline;font-size:28px;margin:0 8px}.brand span{display:none}.pjp{font-size:18px}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <button class="brand" data-go="home" aria-label="홈으로"><b>関西</b><span>일본어 스피킹 코치</span></button>
  <span class="sp"></span>
  <span class="pill" id="prog">0 / 73</span>
  <button class="tbtn" data-go="review">복습</button>
</div></div>
<main class="wrap" id="app"></main>

, "下手ですけど / 日本語は / がんばります / まだ"], "C": ["이유를 넣어서(길을 모르니까) 길 묻기", "역접을 써서(비싸지만 맛있다) 감상 말하기"], "ans": {"A": {"1": "ので", "2": "なので", "3": "けど", "4": "ので"}, "B": {"1": "大阪は 初めてなので、おすすめを 教えてください。", "2": "日本語は まだ 下手ですけど、がんばります。"}, "C": {"1": "道が わからないので、教えていただけませんか。", "2": "高いけど、おいしいです。"}}}, "turns": [{"who": "あなた", "text": "すみません、大阪は 初めてなので、おすすめの お店(みせ)を 教えてもらえますか。", "scene": "", "sn": 0, "me": true}, {"who": "スタッフ", "text": "はい。和食(わしょく)と ラーメンと、どちらが いいですか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "ラーメンが 食べたいです。辛(から)いのは 苦手(にがて)ですけど。", "scene": "", "sn": 0, "me": true}, {"who": "スタッフ", "text": "それなら、この お店が いいですよ。辛くないです。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "ありがとうございます。行(い)ってみます。", "scene": "", "sn": 0, "me": true}], "s4md": "**1) 따라 말하기** — 위 문형 4개를 3번씩, 소리 내어 읽습니다.\n\n**2) 바꿔 말하기** — 「\\_\\_\\_ ので、休みたいです。」의 빈칸에 하나씩 넣어 말합니다.\n\n疲(つか)れた / 歩(ある)きすぎた / 暑(あつ)い / 寒(さむ)い\n\n**3) 롤플레이** — 호텔 프런트에서 식당 추천을 받는 장면입니다.\n\n- **あなた**: すみません、大阪は 初めてなので、おすすめの お店(みせ)を 教えてもらえますか。\n- **スタッフ**: はい。和食(わしょく)と ラーメンと、どちらが いいですか。\n- **あなた**: ラーメンが 食べたいです。辛(から)いのは 苦手(にがて)ですけど。\n- **スタッフ**: それなら、この お店が いいですよ。辛くないです。\n- **あなた**: ありがとうございます。行(い)ってみます。\n\n끝나면 처음부터 한 번 더 말하면서 녹음해 둡니다.", "s5": ["「〜ので」로 이유를 먼저 말하고 부탁할 수 있다", "명사·な형용사 뒤에는 「なので」를 쓴다", "롤플레이를 1번 녹음했다"], "s5md": "", "ans": "- A: 1. ので / 2. なので / 3. けど / 4. ので\n- B: 1. 大阪は 初めてなので、おすすめを 教えてください。 / 2. 日本語は まだ 下手ですけど、がんばります。\n- C 예시: 1. 道が わからないので、教えていただけませんか。 / 2. 高いけど、おいしいです。"}, {"n": 7, "date": "11/12", "dow": "목", "title": "1주차 종합 — 한 장면씩 이어 말하기", "goal": "이번 주 문형을 번역·롤플레이로 다시 꺼내 쓴다.", "rows": [{"jp": "観光(かんこう)で 来(き)ました。十一日間(じゅういちにちかん) います。", "ko": "관광으로 왔습니다. 11일 있습니다.", "tag": "Day 1"}, {"jp": "写真(しゃしん)を 撮(と)っていただけませんか。", "ko": "사진을 찍어 주실 수 있을까요?", "tag": "Day 2"}, {"jp": "十一日間 滞在(たいざい)する 予定(よてい)です。", "ko": "11일 체류할 예정입니다.", "tag": "Day 3"}, {"jp": "大阪駅(おおさかえき)へは どう 行(い)けば いいですか。", "ko": "오사카역에는 어떻게 가면 됩니까?", "tag": "Day 4"}, {"jp": "えびは 食(た)べられません。ねぎ抜(ぬ)きで お願(ねが)いします。", "ko": "새우는 못 먹습니다. 파는 빼 주세요.", "tag": "Day 5"}, {"jp": "初(はじ)めてなので、教(おし)えてもらえますか。", "ko": "처음이라서 알려 주실 수 있을까요?", "tag": "Day 6"}], "listen": [], "s1md": "이번 주 핵심 문장을 하나씩 소리 내어 읽습니다. 막혔던 문장 옆에 표시하세요.", "s2": "이번 주 패턴을 한 장으로 정리합니다.\n\n| 패턴 | 형태 | 한국어 |\n| --- | --- | --- |\n| 목적 | 動詞ます형 어간 + に来ました | ~하러 왔습니다 |\n| 허가 | 〜ても いいですか | ~해도 됩니까? |\n| 정중한 부탁 | 〜ていただけませんか | ~해 주실 수 있을까요? |\n| 예정 | 〜予定です | ~할 예정입니다 |\n| 방법 | どう 〜ば いいですか | 어떻게 ~하면 됩니까? |\n| 가능 | 〜られません / 〜めません | ~할 수 없습니다 |\n| 이유 | 〜ので | ~라서 |\n| 역접 | 〜けど / 〜が | ~지만 |", "s3": {"md": "다음 한국어 문장을 일본어로 써 봅니다. 먼저 정답을 보지 않고 6문장을 모두 쓴 다음 확인하세요.\n\n1. 사진 좀 찍어 주실 수 있을까요?\n2. 오사카역에는 어떻게 가면 됩니까?\n3. 관광으로 왔고, 11일 있습니다.\n4. 새우는 못 먹습니다.\n5. 처음이라서 추천을 알려 주세요.\n6. 일본어는 서툴지만 열심히 하겠습니다.", "G": ["사진 좀 찍어 주실 수 있을까요?", "오사카역에는 어떻게 가면 됩니까?", "관광으로 왔고, 11일 있습니다.", "새우는 못 먹습니다.", "처음이라서 추천을 알려 주세요.", "일본어는 서툴지만 열심히 하겠습니다."], "ans": {"G": {"1": "すみません、写真を 撮っていただけませんか。", "2": "大阪駅へは どう 行けば いいですか。", "3": "観光で 来ました。十一日間 います。", "4": "えびは 食べられません。", "5": "初めてなので、おすすめを 教えてください。", "6": "日本語は 下手ですけど、がんばります。"}}}, "turns": [{"who": "審査官(しんさかん)", "text": "入国の 目的は 何ですか。何日間 滞在しますか。", "scene": "장면 1 · 입국심사", "sn": 1, "me": false}, {"who": "あなた", "text": "観光です。十一日間 滞在します。", "scene": "장면 1 · 입국심사", "sn": 1, "me": true}, {"who": "あなた", "text": "すみません、大阪駅へは どう 行けば いいですか。", "scene": "장면 2 · 길 묻기", "sn": 2, "me": true}, {"who": "通行人(つうこうにん)", "text": "まっすぐ 行って、右に 曲がってください。", "scene": "장면 2 · 길 묻기", "sn": 2, "me": false}, {"who": "あなた", "text": "ありがとうございます。助(たす)かりました。", "scene": "장면 2 · 길 묻기", "sn": 2, "me": true}, {"who": "店員(てんいん)", "text": "ご注文は お決まりですか。", "scene": "장면 3 · 식당", "sn": 3, "me": false}, {"who": "あなた", "text": "おすすめは 何ですか。えびは 食べられません。", "scene": "장면 3 · 식당", "sn": 3, "me": true}, {"who": "店員", "text": "それなら、こちらの うどんが いいですよ。", "scene": "장면 3 · 식당", "sn": 3, "me": false}, {"who": "あなた", "text": "じゃあ、それに します。ねぎ抜きで お願いします。", "scene": "장면 3 · 식당", "sn": 3, "me": true}], "s4md": "**롤플레이** — 입국 → 길 묻기 → 식당까지 이어 말합니다. 나(あなた) 대사만 소리 내어 말하세요.\n\n장면 1 · 입국심사\n\n- **審査官(しんさかん)**: 入国の 目的は 何ですか。何日間 滞在しますか。\n- **あなた**: 観光です。十一日間 滞在します。\n\n장면 2 · 길 묻기\n\n- **あなた**: すみません、大阪駅へは どう 行けば いいですか。\n- **通行人(つうこうにん)**: まっすぐ 行って、右に 曲がってください。\n- **あなた**: ありがとうございます。助(たす)かりました。\n\n장면 3 · 식당\n\n- **店員(てんいん)**: ご注文は お決まりですか。\n- **あなた**: おすすめは 何ですか。えびは 食べられません。\n- **店員**: それなら、こちらの うどんが いいですよ。\n- **あなた**: じゃあ、それに します。ねぎ抜きで お願いします。\n\n처음부터 끝까지 한 번에 말하면서 녹음하고, 다시 들으며 막힌 곳에 표시합니다.", "s5": ["번역 6문장 중 4문장 이상 맞혔다", "롤플레이를 막힘없이 1번 녹음했다", "막힌 문장을 표시해 두었다 (다음 주차에 반영)"], "s5md": "", "ans": "1. すみません、写真を 撮っていただけませんか。\n2. 大阪駅へは どう 行けば いいですか。\n3. 観光で 来ました。十一日間 います。\n4. えびは 食べられません。\n5. 初めてなので、おすすめを 教えてください。\n6. 日本語は 下手ですけど、がんばります。"}, {"n": 8, "date": "11/13", "dow": "금", "title": "공항→시내 — 〜行き / どれに 乗れば いいですか", "goal": "공항에서 시내로 가는 전철을 묻고, 승강장 안내를 알아듣는다.", "rows": [{"jp": "関西空港(かんさいくうこう)から 大阪駅(おおさかえき)まで どう 行(い)けば いいですか。", "ko": "간사이공항에서 오사카역까지 어떻게 가면 됩니까?"}, {"jp": "大阪行(おおさかゆ)きの 電車(でんしゃ)は どれですか。", "ko": "오사카행 전철은 어느 것입니까?"}, {"jp": "切符(きっぷ)は どこで 買(か)えますか。", "ko": "표는 어디서 살 수 있습니까?"}, {"jp": "次(つぎ)の 電車は 何時(なんじ)ですか。", "ko": "다음 전철은 몇 시입니까?"}], "listen": [{"jp": "大阪方面(ほうめん)は 二番線(にばんせん)です。", "ko": "오사카 방면은 2번선입니다."}, {"jp": "次の 電車は 十分後(じっぷんご)に 出(で)ます。", "ko": "다음 전철은 10분 뒤에 출발합니다."}], "s1md": "", "s2": "| 형태 | 예문 | 뜻 |\n| --- | --- | --- |\n| 〜行(ゆ)き | 大阪行き | 오사카행 |\n| 〜番線(ばんせん) | 二番線 | 2번선(승강장) |\n| どれ / どの + 명사 | どの電車ですか | 어느 전철입니까 |\n| 〜に 乗(の)れば いいですか | 何(なん)に 乗れば いいですか | 무엇을 타면 됩니까 |\n\n- 「乗る」는 한국어 \"~을 타다\"와 달리 조사 **に**를 씁니다. 電車に乗る. 내릴 때는 「駅で降(お)りる」처럼 **で**를 씁니다.", "s3": {"md": "**A. 빈칸 채우기**\n\n1. 電車( ) 乗ります。\n2. 大阪( )の 電車は どれですか。\n3. 何番線( ) 乗れば いいですか。\n4. 次の 駅( ) 降りてください。\n\n**B. 순서 맞추기**\n\n1. 電車は / 大阪行きの / どれですか\n2. 買えますか / 切符は / どこで\n\n**C. 직접 쓰기 (2문장)**\n\n1. 간사이공항에서 오사카역까지 가는 방법 묻기\n2. 오사카행 전철이 몇 번선인지 묻기", "A": ["電車( ) 乗ります。", "大阪( )の 電車は どれですか。", "何番線( ) 乗れば いいですか。", "次の 駅( ) 降りてください。"], "B": ["電車は / 大阪行きの / どれですか", "買えますか / 切符は / どこで"], "C": ["간사이공항에서 오사카역까지 가는 방법 묻기", "오사카행 전철이 몇 번선인지 묻기"], "ans": {"A": {"1": "に", "2": "行き", "3": "に", "4": "で"}, "B": {"1": "大阪行きの 電車は どれですか。", "2": "切符は どこで 買えますか。"}, "C": {"1": "関西空港から 大阪駅まで どう 行けば いいですか。", "2": "大阪行きは 何番線ですか。"}}}, "turns": [{"who": "あなた", "text": "すみません、大阪駅まで どう 行けば いいですか。", "scene": "", "sn": 0, "me": true}, {"who": "係員(かかりいん)", "text": "関空快速(かんくうかいそく)が 便利(べんり)ですよ。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "切符は どこで 買えますか。", "scene": "", "sn": 0, "me": true}, {"who": "係員", "text": "あちらの 券売機(けんばいき)で 買えます。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "大阪行きは 何番線ですか。", "scene": "", "sn": 0, "me": true}, {"who": "係員", "text": "二番線です。次の 電車は 十分後に 出ます。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "ありがとうございます。", "scene": "", "sn": 0, "me": true}], "s4md": "**1) 따라 말하기** — 위 문형 4개와 듣기용 문장을 3번씩 읽습니다.\n\n**2) 바꿔 말하기** — 「\\_\\_\\_ 行きは どれですか。」\n\n大阪(おおさか) / 神戸(こうべ) / 京都(きょうと) / 奈良(なら)\n\n**3) 롤플레이** — 공항 안내 카운터 장면입니다.\n\n- **あなた**: すみません、大阪駅まで どう 行けば いいですか。\n- **係員(かかりいん)**: 関空快速(かんくうかいそく)が 便利(べんり)ですよ。\n- **あなた**: 切符は どこで 買えますか。\n- **係員**: あちらの 券売機(けんばいき)で 買えます。\n- **あなた**: 大阪行きは 何番線ですか。\n- **係員**: 二番線です。次の 電車は 十分後に 出ます。\n- **あなた**: ありがとうございます。", "s5": ["「〜に 乗る」「〜で 降りる」 조사를 바로 말할 수 있다", "〜行き, 〜番線을 듣고 알아들었다", "롤플레이를 1번 녹음했다"], "s5md": "", "ans": "- A: 1. に / 2. 行き / 3. に / 4. で\n- B: 1. 大阪行きの 電車は どれですか。 / 2. 切符は どこで 買えますか。\n- C 예시: 1. 関西空港から 大阪駅まで どう 行けば いいですか。 / 2. 大阪行きは 何番線ですか。"}, {"n": 9, "date": "11/14", "dow": "토", "title": "교통카드·표 — 〜を チャージしたいです", "goal": "교통카드(ICOCA)를 사고 충전하고, 표를 산다.", "rows": [{"jp": "ICOCA(イコカ)を 一枚(いちまい) ください。", "ko": "ICOCA를 한 장 주세요."}, {"jp": "二千円(にせんえん)、チャージしたいです。", "ko": "2천 엔 충전하고 싶습니다."}, {"jp": "残高(ざんだか)を 確認(かくにん)したいんですが。", "ko": "잔액을 확인하고 싶은데요."}, {"jp": "神戸(こうべ)まで 大人(おとな)二枚(にまい)、往復(おうふく)で お願(ねが)いします。", "ko": "고베까지 어른 2장 왕복으로 부탁합니다."}], "listen": [{"jp": "全部(ぜんぶ)で 二千円です。", "ko": "전부 2천 엔입니다."}, {"jp": "デポジットが 五百円(ごひゃくえん)かかります。", "ko": "보증금이 500엔 듭니다."}], "s1md": "", "s2": "| 형태 | 예문 | 뜻 |\n| --- | --- | --- |\n| 〜たいです | チャージしたいです | ~하고 싶습니다 |\n| 〜たいんですが | 確認したいんですが | ~하고 싶은데요 (부드러운 요청) |\n| 〜枚(まい) | 二枚 ?", "tag": "Day 18"}, {"jp": "これを 追加(ついか)したいんですが。", "ko": "이걸 추가하고 싶은데요.", "tag": "Day 19"}, {"jp": "カードで 払(はら)えますか。", "ko": "카드로 낼 수 있습니까?", "tag": "Day 20"}], "listen": [], "s1md": "", "s2": "| 패턴 | 형태 | 한국어 |\n| --- | --- | --- |\n| 예약 확인 | 〜ていません / 〜ました | ~하지 않았습니다 / ~했습니다 |\n| 희망 | 〜が いいんですが | ~가 좋은데요 |\n| 과다 | 〜すぎます / 少なめ | 너무 ~합니다 / 적게 |\n| 확인 | 〜が 入っていますか | ~이 들어 있습니까 |\n| 변경 | 〜に 変えてもらえますか | ~로 바꿔 주실 수 있습니까 |\n| 결제 | 〜で 払えますか | ~로 낼 수 있습니까 |", "s3": {"md": "다음 문장을 일본어로 써 봅니다. 6문장을 모두 쓴 뒤 정답을 확인하세요.\n\n1. 예약은 안 했는데 세 명 들어갈 수 있습니까?\n2. 맵지 않은 것이 좋은데 추천이 있습니까?\n3. 양이 너무 많아서 못 먹겠습니다.\n4. 이 요리에 달걀은 들어 있습니까?\n5. 주문을 라멘으로 바꿔 주실 수 있습니까?\n6. 따로따로 카드로 낼 수 있습니까?", "G": ["예약은 안 했는데 세 명 들어갈 수 있습니까?", "맵지 않은 것이 좋은데 추천이 있습니까?", "양이 너무 많아서 못 먹겠습니다.", "이 요리에 달걀은 들어 있습니까?", "주문을 라멘으로 바꿔 주실 수 있습니까?", "따로따로 카드로 낼 수 있습니까?"], "ans": {"G": {"1": "予約は していませんが、三人 入れますか。", "2": "辛くない ものが いいんですが、おすすめは ありますか。", "3": "量が 多すぎて、食べられません。", "4": "この 料理に 卵は 入って いますか。", "5": "注文を ラーメンに 変えてもらえますか。", "6": "別々に カードで 払えますか。"}}}, "turns": [{"who": "店員(てんいん)", "text": "いらっしゃいませ。何名様(なんめいさま)ですか。", "scene": "장면 1 · 입장", "sn": 1, "me": false}, {"who": "あなた", "text": "二人です。予約は して いませんが、入れますか。", "scene": "장면 1 · 입장", "sn": 1, "me": true}, {"who": "店員", "text": "ご注文(ちゅうもん)は お決(き)まりですか。", "scene": "장면 2 · 주문", "sn": 2, "me": false}, {"who": "あなた", "text": "辛くない ものが いいんですが、おすすめは ありますか。えびの アレルギーが あります。", "scene": "장면 2 · 주문", "sn": 2, "me": true}, {"who": "店員", "text": "こちらの うどんが 大丈夫(だいじょうぶ)です。", "scene": "장면 2 · 주문", "sn": 2, "me": false}, {"who": "あなた", "text": "じゃあ、それに します。ご飯は 少なめで お願いします。", "scene": "장면 2 · 주문", "sn": 2, "me": true}, {"who": "あなた", "text": "お会計を お願いします。別々に カードで 払えますか。", "scene": "장면 3 · 계산", "sn": 3, "me": true}], "s4md": "**롤플레이** — 입장부터 계산까지 이어 말합니다. 나(あなた) 대사만 소리 내어 말하세요.\n\n장면 1 · 입장\n\n- **店員(てんいん)**: いらっしゃいませ。何名様(なんめいさま)ですか。\n- **あなた**: 二人です。予約は して いませんが、入れますか。\n\n장면 2 · 주문\n\n- **店員**: ご注文(ちゅうもん)は お決(き)まりですか。\n- **あなた**: 辛くない ものが いいんですが、おすすめは ありますか。えびの アレルギーが あります。\n- **店員**: こちらの うどんが 大丈夫(だいじょうぶ)です。\n- **あなた**: じゃあ、それに します。ご飯は 少なめで お願いします。\n\n장면 3 · 계산\n\n- **あなた**: お会計を お願いします。別々に カードで 払えますか。\n\n처음부터 끝까지 한 번에 말하면서 녹음하고, 막힌 곳에 표시합니다.", "s5": ["번역 6문장 중 4문장 이상 맞혔다", "롤플레이를 막힘없이 1번 녹음했다", "막힌 문장을 표시해 두었다"], "s5md": "", "ans": "1. 予約は していませんが、三人 入れますか。\n2. 辛くない ものが いいんですが、おすすめは ありますか。\n3. 量が 多すぎて、食べられません。\n4. この 料理に 卵は 入って いますか。\n5. 注文を ラーメンに 変えてもらえますか。\n6. 別々に カードで 払えますか。"}, {"n": 22, "date": "11/27", "dow": "금", "title": "가격·할인 — いくらですか / 税込ですか", "goal": "가격과 세금 포함 여부, 세일·할인 정보를 묻고 알아듣는다.", "rows": [{"jp": "これは いくらですか。", "ko": "이건 얼마입니까?"}, {"jp": "税込(ぜいこみ)ですか。", "ko": "세금 포함입니까?"}, {"jp": "セールは いつまでですか。", "ko": "세일은 언제까지입니까?"}, {"jp": "割引(わりびき)は ありますか。", "ko": "할인은 있습니까?"}], "listen": [{"jp": "税抜(ぜいぬ)きで 千円(せんえん)です。", "ko": "세금 별도 1천 엔입니다."}, {"jp": "今日(きょう)までの セールです。", "ko": "오늘까지 세일입니다."}, {"jp": "二点(にてん)で 二割引(にわりびき)です。", "ko": "2점에 20% 할인입니다."}], "s1md": "", "s2": "| 용도 | 형태 | 예문 |\n| --- | --- | --- |\n| 가격 | いくらですか | これは いくらですか |\n| 세금 | 税込(ぜいこみ) / 税抜(ぜいぬ)き | 税込で 千円 |\n| 기한 | 〜まで | 日曜日(にちようび)までです |\n| 할인 | 〜割引(わりびき) | 二割引 = 20% 할인 |\n\n- 일본 가격표는 세금 별도 표시와 세금 포함 표시가 섞여 있어서, 계산대에서 놀라지 않으려면 「税込ですか」를 습관처럼 묻는 것이 좋습니다.\n- 만 단위: 一万円(いちまんえん) / 二万円(にまんえん) / 三万円(さんまんえん) / 五万円(ごまんえん).", "s3": {"md": "**A. 빈칸 채우기**\n\n1. これは いくら( )。\n2. これは ( )ですか。(세금 포함)\n3. セールは いつ( )ですか。\n4. 割引は あります( )。\n\n**B. 순서 맞추기**\n\n1. 税込ですか / これは\n2. いつまでですか / セールは\n\n**C. 직접 쓰기 (2문장)**\n\n1. 가격을 묻고 세금 포함인지 확인하기\n2. 할인이 있는지 묻기", "A": ["これは いくら( )。", "これは ( )ですか。(세금 포함)", "セールは いつ( )ですか。", "割引は あります( )。"], "B": ["税込ですか / これは", "いつまでですか / セールは"], "C": ["가격을 묻고 세금 포함인지 확인하기", "할인이 있는지 묻기"], "ans": {"A": {"1": "ですか", "2": "税込", "3": "まで", "4": "か"}, "B": {"1": "これは 税込ですか。", "2": "セールは いつまでですか。"}, "C": {"1": "これは いくらですか。税込ですか。", "2": "割引は ありますか。"}}}, "turns": [{"who": "あなた", "text": "すみません、これは いくらですか。", "scene": "", "sn": 0, "me": true}, {"who": "店員(てんいん)", "text": "千二百円(せんにひゃくえん)です。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "税込ですか。", "scene": "", "sn": 0, y 25"}, {"jp": "日焼(ひや)け止(ど)めは どこに ありますか。", "ko": "선크림은 어디에 있습니까?", "tag": "Day 26"}, {"jp": "サイズが 違(ちが)って いました。交換(こうかん)したいんですが。", "ko": "사이즈가 달랐습니다. 교환하고 싶은데요.", "tag": "Day 27"}], "listen": [], "s1md": "", "s2": "| 패턴 | 형태 | 한국어 |\n| --- | --- | --- |\n| 확인 | 〜ですか / 〜は ありますか | ~입니까 / ~은 있습니까 |\n| 형용사 + の | 大きいのは / 安(やす)いのは | 큰 것은 / 싼 것은 |\n| 비교·한정 | 〜より 〜の ほうが / 〜しか ありません | ~보다 ~쪽이 / ~밖에 없다 |\n| 시도·허가 | 〜てみても いいですか | 한번 ~해 봐도 됩니까 |\n| 용도·수단 | 〜用 / 〜で 買えますか | ~용 / ~로 살 수 있습니까 |\n| 부탁 | 〜てもらえますか / 〜したいんですが | ~해 주실 수 있습니까 / ~하고 싶은데요 |", "s3": {"md": "다음 문장을 일본어로 써 봅니다. 6문장을 모두 쓴 뒤 정답을 확인하세요.\n\n1. 이건 세금 포함입니까?\n2. 조금 더 작은 것은 있습니까?\n3. 이 신발을 신어 봐도 됩니까?\n4. 선물이라서 따로따로 포장해 주실 수 있습니까?\n5. 봉투는 필요 없습니다.\n6. 사이즈가 달랐습니다. 교환하고 싶은데요.", "G": ["이건 세금 포함입니까?", "조금 더 작은 것은 있습니까?", "이 신발을 신어 봐도 됩니까?", "선물이라서 따로따로 포장해 주실 수 있습니까?", "봉투는 필요 없습니다.", "사이즈가 달랐습니다. 교환하고 싶은데요."], "ans": {"G": {"1": "これは 税込ですか。", "2": "もう 少し 小さいのは ありますか。", "3": "この 靴を 履いてみても いいですか。", "4": "贈り物なので、別々に 包んで もらえますか。", "5": "袋は いりません。", "6": "サイズが 違って いました。交換したいんですが。"}}}, "turns": [{"who": "店員(てんいん)", "text": "いらっしゃいませ。", "scene": "장면 1 · 가격·사이즈", "sn": 1, "me": false}, {"who": "あなた", "text": "すみません、これは 税込ですか。もう 少し 小さいのは ありますか。", "scene": "장면 1 · 가격·사이즈", "sn": 1, "me": true}, {"who": "店員", "text": "試着室(しちゃくしつ)は こちらです。", "scene": "장면 2 · 입어 보기", "sn": 2, "me": false}, {"who": "あなた", "text": "着てみても いいですか。ちょうど いいです。これを ください。", "scene": "장면 2 · 입어 보기", "sn": 2, "me": true}, {"who": "あなた", "text": "免税で 買えますか。贈り物なので、別々に 包んで もらえますか。袋は いりません。", "scene": "장면 3 · 면세·포장", "sn": 3, "me": true}, {"who": "あなた", "text": "すみません、サイズが 違って いました。交換したいんですが。", "scene": "장면 4 · 교환", "sn": 4, "me": true}], "s4md": "**롤플레이** — 쇼핑 전 과정을 이어 말합니다. 나(あなた) 대사만 소리 내어 말하세요.\n\n장면 1 · 가격·사이즈\n\n- **店員(てんいん)**: いらっしゃいませ。\n- **あなた**: すみません、これは 税込ですか。もう 少し 小さいのは ありますか。\n\n장면 2 · 입어 보기\n\n- **店員**: 試着室(しちゃくしつ)は こちらです。\n- **あなた**: 着てみても いいですか。ちょうど いいです。これを ください。\n\n장면 3 · 면세·포장\n\n- **あなた**: 免税で 買えますか。贈り物なので、別々に 包んで もらえますか。袋は いりません。\n\n장면 4 · 교환\n\n まりました。すぐに お持(も)ちします。", "ko": "알겠습니다. 바로 가져다 드리겠습니다."}, {"jp": "何時(なんじ)に お呼(よ)びしましょうか。", "ko": "몇 시에 부를까요?"}], "s1md": "", "s2": "| 용도 | 형태 | 예문 |\n| --- | --- | --- |\n| 미리 해 두기 | 〜て おく | 呼んで おく |\n| 부탁 | 〜て おいて もらえますか | 呼んで おいて もらえますか |\n| 안 해도 됨 | 〜なくても いいです | しなくても いいです |\n| 하지 마세요 | 〜ないで ください | 入(はい)らないで ください |\n\n- 「〜ておく」는 \"미리 해 두다\"라는 뜻이어서, 아침 택시처럼 미래의 일을 부탁할 때 자연스럽습니다.\n- 「〜なくて いいです」는 「〜なくても いいです」의 줄임말입니다. 청소 같은 서비스를 정중하게 사양할 때 「掃除は 大丈夫(だいじょうぶ)です」도 많이 씁니다.", "s3": {"md": "**A. 빈칸 채우기**\n\n1. タオルを もう 二( ) お願いします。\n2. 掃除は しなくて ( )。\n3. タクシーを 呼んで ( ) もらえますか。\n4. 部屋に 入ら( ) ください。\n\n**B. 순서 맞추기**\n\n1. 呼んで / おいて / もらえますか / タクシーを\n2. しなくて / 掃除は / いいです\n\n**C. 직접 쓰기 (2문장)**\n\n1. 수건 두 장 더 부탁하기\n2. 내일 아침 택시를 불러 놓아 달라고 부탁하기", "A": ["タオルを もう 二( ) お願いします。", "掃除は しなくて ( )。", "タクシーを 呼んで ( ) もらえますか。", "部屋に 入ら( ) ください。"], "B": ["呼んで / おいて / もらえますか / タクシーを", "しなくて / 掃除は / いいです"], "C": ["수건 두 장 더 부탁하기", "내일 아침 택시를 불러 놓아 달라고 부탁하기"], "ans": {"A": {"1": "枚", "2": "いいです", "3": "おいて", "4": "ないで"}, "B": {"1": "タクシーを 呼んで おいて もらえますか。", "2": "掃除は しなくて いいです。"}, "C": {"1": "タオルを もう 二枚 お願いします。", "2": "明日の 朝、タクシーを 呼んで おいて もらえますか。"}}}, "turns": [{"who": "あなた", "text": "すみません、タオルを もう 二枚 お願いします。", "scene": "", "sn": 0, "me": true}, {"who": "フロント", "text": "かしこまりました。すぐに お持ちします。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "それから、明日の 朝 七時に タクシーを 呼んで おいて もらえますか。", "scene": "", "sn": 0, "me": true}, {"who": "フロント", "text": "はい、どちらまで ですか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "大阪駅まで お願いします。あと、掃除は しなくて いいです。", "scene": "", "sn": 0, "me": true}], "s4md": "**1) 따라 말하기** — 위 문형 4개와 듣기용 문장을 3번씩 읽습니다.\n\n**2) 바꿔 말하기** — 「\\_\\_\\_ を もう 一枚 お願いします。」\n\nタオル / 毛布(もうふ) / バスタオル / 布団(ふとん)\n\n**3) 롤플레이** — 프런트에 전화·방문해서 요청하는 장면입니다.\n\n- **あなた**: すみません、タオルを もう 二枚 お願いします。\n- **フロント**: かしこまりました。すぐに お持ちします。\n- **あなた**: それから、明日の 朝 七時に タクシーを 呼んで おいて もらえますか。\n- **フロント**: はい、どちらまで ですか。\n- **あなた**: 大阪駅まで お願いします。あと、掃除は しなくて いいです。", "s5": ["「〜ておいて もらえますか」를 말할 수 있다", "「〜なくて いいです」로 사양할  "롤플레이를 1번 녹음했다"], "s5md": "", "ans": "- A: 1. こと / 2. によって / 3. います / 4. ので\n- B: 1. 清水寺に 行った ことが ありますか。 / 2. 空いて いる 時間は いつですか。\n- C 예시: 1. 京都で おすすめの 場所を 教えて ください。 / 2. 空いて いる 時間は いつですか。"}, {"n": 41, "date": "12/16", "dow": "수", "title": "사진·예절 — 〜ては いけません", "goal": "촬영 규칙과 관람 예절을 묻고, 금지 표현을 알아듣는다.", "rows": [{"jp": "ここは 撮影禁止(さつえいきんし)ですか。", "ko": "여기는 촬영 금지입니까?"}, {"jp": "フラッシュを 使(つか)っても いいですか。", "ko": "플래시를 써도 됩니까?"}, {"jp": "触(さわ)っては いけません。", "ko": "만져서는 안 됩니다."}, {"jp": "中(なか)では 静(しず)かに して ください。", "ko": "안에서는 조용히 해 주세요."}], "listen": [{"jp": "撮影は ご遠慮(えんりょ)ください。", "ko": "촬영은 삼가 주세요."}, {"jp": "靴(くつ)を 脱(ぬ)いで お上(あ)がりください。", "ko": "신발을 벗고 올라가 주세요."}, {"jp": "飲食(いんしょく)は できません。", "ko": "음식물은 안 됩니다."}], "s1md": "", "s2": "| 용도 | 형태 | 예문 |\n| --- | --- | --- |\n| 금지 | 〜ては いけません | 触っては いけません |\n| 부탁(하지 마세요) | 〜ないで ください | 触らないで ください |\n| 정중 금지(안내) | ご遠慮(えんりょ)ください | 撮影は ご遠慮ください |\n| 허가 질문 | 〜ても いいですか | 撮っても いいですか |\n\n- 「ご遠慮ください」는 \"삼가 주세요\"라는 간접적이지만 사실상 금지를 뜻하는 안내 표현입니다. 이 말이 나오면 「はい、わかりました」로 따르면 됩니다.\n- 사원이나 신사 내부는 촬영 금지인 곳이 많아서, 사진을 찍기 전에 「撮影しても いいですか」로 한 번 묻는 것이 안전합니다.", "s3": {"md": "**A. 빈칸 채우기**\n\n1. ここは 撮影( )ですか。\n2. 触っては ( )。\n3. 中では 静かに( ) ください。\n4. フラッシュを 使っ( ) いいですか。\n\n**B. 순서 맞추기**\n\n1. 使っても / フラッシュを / いいですか\n2. 触っては / いけません / ここは\n\n**C. 직접 쓰기 (2문장)**\n\n1. 여기서 사진을 찍어도 되는지 묻기\n2. 플래시를 써도 되는지 묻기", "A": ["ここは 撮影( )ですか。", "触っては ( )。", "中では 静かに( ) ください。", "フラッシュを 使っ( ) いいですか。"], "B": ["使っても / フラッシュを / いいですか", "触っては / いけません / ここは"], "C": ["여기서 사진을 찍어도 되는지 묻기", "플래시를 써도 되는지 묻기"], "ans": {"A": {"1": "禁止", "2": "いけません", "3": "して", "4": "ても"}, "B": {"1": "フラッシュを 使っても いいですか。", "2": "ここは 触っては いけません。"}, "C": {"1": "ここで 写真を 撮っても いいですか。", "2": "フラッシュを 使っても いいですか。"}}}, "turns": [{"who": "あなた", "text": "すみません、ここは 撮影禁止ですか。", "scene": "", "sn": 0, "me": true}, {"who": "係員(かかりいん)", "text": "中は 撮影は ご遠慮ください。外(そと)は 大丈夫です。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "フラッシュを 使っても いいですか。", "scene": "", "sn": 0, "me": true}, {"who": "係員", "text": "フラッシュは 使っては いけません。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "わかりました。靴は 脱ぎますか。", "scene": "", "sn": 0, "me": true}, {"who": "係員", "text": "はい、脱いで お上がりください。", "scene": "", "sn": 0, "me": false}], "s4md": "**1) 따라 말하기** — 위 문형 4개와 듣기용 문장을 3번씩 읽습니다.\n\n**2) 바꿔 말하기** — 「\\_\\_\\_ ては いけませんか。」\n\n写真(しゃしん)を 撮(と)っ / 中(なか)に 入(はい)っ / 触(さわ)っ / 食(た)べ\n\n**3) 롤플레이** — 사원 내부 장면입니다.\n\n- **あなた**: すみません、ここは 撮影禁止ですか。\n- **係員(かかりいん)**: 中は 撮影は ご遠慮ください。外(そと)は 大丈夫です。\n- **あなた**: フラッシュを 使っても いいですか。\n- **係員**: フラッシュは 使っては いけません。\n- **あなた**: わかりました。靴は 脱ぎますか。\n- **係員**: はい、脱いで お上がりください。", "s5": ["「〜ては いけません」을 알아들었다", "「ご遠慮ください」의 뜻을 안다", "롤플레이를 1번 녹음했다"], "s5md": "", "ans": "- A: 1. 禁止 / 2. いけません / 3. して / 4. ても\n- B: 1. フラッシュを 使っても いいですか。 / 2. ここは 触っては いけません。\n- C 예시: 1. ここで 写真を 撮っても いいですか。 / 2. フラッシュを 使っても いいですか。"}, {"n": 42, "date": "12/17", "dow": "목", "title": "6주차 종합 — 교토 관광 전 과정", "goal": "입장 → 영업시간·소요 시간 확인 → 안내소 → 촬영 규칙까지 이어 말한다.", "rows": [{"jp": "大人(おとな) 二枚(にまい) ください。学生割引(がくせいわりびき)は ありますか。", "ko": "어른 2장 주세요. 학생 할인은 있습니까?", "tag": "Day 36"}, {"jp": "何時(なんじ)まで 開(あ)いて いますか。", "ko": "몇 시까지 열려 있습니까?", "tag": "Day 37"}, {"jp": "見学(けんがく)する のに どのぐらい かかりますか。", "ko": "견학하는 데 어느 정도 걸립니까?", "tag": "Day 38"}, {"jp": "韓国語(かんこくご)の パンフレットは ありますか。", "ko": "한국어 팸플릿은 있습니까?", "tag": "Day 39"}, {"jp": "京都(きょうと)で おすすめの 場所(ばしょ)を 教(おし)えて ください。", "ko": "교토에서 추천 장소를 알려 주세요.", "tag": "Day 40"}, {"jp": "ここは 撮影禁止(さつえいきんし)ですか。", "ko": "여기는 촬영 금지입니까?", "tag": "Day 41"}], "listen": [], "s1md": "", "s2": "| 패턴 | 형태 | 한국어 |\n| --- | --- | --- |\n| 가능 | 〜ことが できます / 가능형 | ~할 수 있습니다 |\n| 소요 | 〜のに 〜 かかります | ~하는 데 ~ 걸립니다 |\n| 기한 | 〜までに | ~까지 |\n| 경험 | 〜た ことが あります | ~한 적이 있습니다 |\n| ~에 따라 | 〜によって | ~에 따라 |\n| 금지·허가 | 〜ては いけません / 〜ても いいですか | ~해서는 안 됩니다 / ~해도 됩니까 |", "s3": {"md": "다음 문장을 일본어로 써 봅니다. 6문장을 모두 쓴 뒤 정답을 확인하세요.\n\n1. 어른 두 장, 학생 한 장 주세요.\n2. 몇 시부터 몇 시까지 열려 있습니까?\n3. 한 바퀴 도는 데 어느 정도 걸립니까?\n4. 한국어 지도는 있습니까?\n5. 기요미즈데라에 가 본 적이 있습니까?\n6. 여기서 사진을 찍어도 됩니까?", "G": ["어른 두 장, 학생 한 장 주세요.", "몇 시부터 몇 시까지 열려 있습니까?", "한 바퀴 n| --- | --- | --- |\n| 동사 | 行(い)く + と | 行くと 思います |\n| い형용사 | いい + と | いいと 思います |\n| な형용사 | きれいだ + と | きれいだと 思います |\n| 명사 | 雨(あめ)だ + と | 雨だと 思います |\n\n- 「と 思います」 앞에는 정중형(〜です)이 아니라 **보통형**이 옵니다. 「いいです」가 아니라 「いいと 思います」, 「雨です」가 아니라 「雨だと 思います」입니다.\n- 의견을 부드럽게 말하는 효과도 있어서, 직접 단정하는 대신 「〜と 思います」를 붙이면 일본어에서는 훨씬 자연스럽습니다.", "s3": {"md": "**A. 빈칸 채우기**\n\n1. これが いい( ) 思います。\n2. 神戸は きれい( ) 思います。\n3. 明日は 雨( ) 思います。\n4. 私も そう ( )。\n\n**B. 순서 맞추기**\n\n1. 思います / いいと / これが / 私は\n2. きれいだと / 思います / 夜景は\n\n**C. 직접 쓰기 (2문장)**\n\n1. 이 가게가 좋다고 생각한다고 말하기\n2. 고베는 아름답다고 생각한다고 말하기", "A": ["これが いい( ) 思います。", "神戸は きれい( ) 思います。", "明日は 雨( ) 思います。", "私も そう ( )。"], "B": ["思います / いいと / これが / 私は", "きれいだと / 思います / 夜景は"], "C": ["이 가게가 좋다고 생각한다고 말하기", "고베는 아름답다고 생각한다고 말하기"], "ans": {"A": {"1": "と", "2": "だと", "3": "だと", "4": "思います"}, "B": {"1": "私は これが いいと 思います。", "2": "夜景は きれいだと 思います。"}, "C": {"1": "この お店は いいと 思います。", "2": "神戸は きれいだと 思います。"}}}, "turns": [{"who": "店員(てんいん)", "text": "大阪は どうですか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "街(まち)が きれいだと 思います。", "scene": "", "sn": 0, "me": true}, {"who": "店員", "text": "日本語は 難しいと 思いますか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "はい、難しいと 思います。でも、楽(たの)しいです。", "scene": "", "sn": 0, "me": true}, {"who": "店員", "text": "そうですか。私も 日本語は 難しいと 思います。", "scene": "", "sn": 0, "me": false}], "s4md": "**1) 따라 말하기** — 위 문형 4개와 듣기용 문장을 3번씩 읽습니다.\n\n**2) 바꿔 말하기** — 「\\_\\_\\_ と 思います。」 (な형용사·명사는 だ를 붙입니다)\n\nおいしい / 高(たか)い / きれいだ / 便利(べんり)だ\n\n**3) 롤플레이** — 카페에서 현지 직원과 대화하는 장면입니다.\n\n- **店員(てんいん)**: 大阪は どうですか。\n- **あなた**: 街(まち)が きれいだと 思います。\n- **店員**: 日本語は 難しいと 思いますか。\n- **あなた**: はい、難しいと 思います。でも、楽(たの)しいです。\n- **店員**: そうですか。私も 日本語は 難しいと 思います。", "s5": ["보통형 + と 思います를 만들 수 있다", "な형용사·명사는 だと를 쓴다", "롤플레이를 1번 녹음했다"], "s5md": "", "ans": "- A: 1. と / 2. だと / 3. だと / 4. 思います\n- B: 1. 私は これが いいと 思います。 / 2. 夜景は きれいだと 思います。\n- C 예시: 1. この お店は いいと 思います。 / 2. 神戸は きれいだと 思います。"}, {"n": 44, "date": "12/19", "dow": "토", "title": "추측 — 〜かもしれません", "goal": "확실하지 않 回目(かいめ) | 二回目(にかいめ)です |\n| 시점 | 去年(きょねん) / 先月(せんげつ) / 先週(せんしゅう) | 去年 行きました |\n\n- 「〜たり 〜たり する」는 た형에 り를 붙여서 대표적인 두 가지 행동을 나열합니다. 한국어 \"~하기도 하고 ~하기도 한다\"입니다. 마지막에는 반드시 する가 옵니다.\n- 대답은 「〜たり、〜たり しました」처럼 두 가지만 예로 들면 충분합니다. 세 가지 이상 나열하는 것은 어색합니다.", "s3": {"md": "**A. 빈칸 채우기**\n\n1. 日本に 来る( ) 初めてです。\n2. 買い物( )、お寺を 見たり しました。\n3. 去年、東京( ) 行きました。\n4. 前に 日本料理を 作った( )が あります。\n\n**B. 순서 맞추기**\n\n1. しました / 見たり / お寺を / 買い物したり\n2. 来るのは / 初めてです / 日本に\n\n**C. 직접 쓰기 (2문장)**\n\n1. 일본에 오는 것은 처음이라고 말하기\n2. 교토에서 쇼핑하기도 하고 절을 구경하기도 했다고 말하기", "A": ["日本に 来る( ) 初めてです。", "買い物( )、お寺を 見たり しました。", "去年、東京( ) 行きました。", "前に 日本料理を 作った( )が あります。"], "B": ["しました / 見たり / お寺を / 買い物したり", "来るのは / 初めてです / 日本に"], "C": ["일본에 오는 것은 처음이라고 말하기", "교토에서 쇼핑하기도 하고 절을 구경하기도 했다고 말하기"], "ans": {"A": {"1": "のは", "2": "したり", "3": "へ(に)", "4": "こと"}, "B": {"1": "買い物したり、お寺を 見たり しました。", "2": "日本に 来るのは 初めてです。"}, "C": {"1": "日本に 来るのは 初めてです。", "2": "京都で 買い物したり、お寺を 見たり しました。"}}}, "turns": [{"who": "スタッフ", "text": "日本は 何回目ですか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "初めてです。", "scene": "", "sn": 0, "me": true}, {"who": "スタッフ", "text": "今日(きょう)は どこに 行きましたか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "大阪城に 行きました。写真を 撮ったり、買い物したり しました。", "scene": "", "sn": 0, "me": true}, {"who": "スタッフ", "text": "いいですね。", "scene": "", "sn": 0, "me": false}], "s4md": "**1) 따라 말하기** — 위 문형 4개와 듣기용 문장을 3번씩 읽습니다.\n\n**2) 바꿔 말하기** — 「\\_\\_\\_ たり \\_\\_\\_ たり しました。」\n\n食(た)べたり 飲(の)んだり / 見(み)たり 買(か)ったり / 歩(ある)いたり 休(やす)んだり / 撮(と)ったり 話(はな)したり\n\n**3) 롤플레이** — 현지 사람과 경험을 이야기하는 장면입니다.\n\n- **スタッフ**: 日本は 何回目ですか。\n- **あなた**: 初めてです。\n- **スタッフ**: 今日(きょう)は どこに 行きましたか。\n- **あなた**: 大阪城に 行きました。写真を 撮ったり、買い物したり しました。\n- **スタッフ**: いいですね。", "s5": ["「〜たり 〜たり する」를 동사만 바꿔 말할 수 있다", "「〜のは 初めてです」를 말할 수 있다", "롤플레이를 1번 녹음했다"], "s5md": "", "ans": "- A: 1. のは / 2. したり / 3. へ(に) / 4. こと\n- B: 1. 買い物したり、お寺を 見たり しました。 / 2. 日本に 来るのは 初めてです。\n- C 예시: 1. 日本に 来るのは 初めてです。 / 2. 京都で 買い物したり、お寺を 見たり しました。"}, {"n": 47, "date": "12/22", "dow": "화", "title": "계획 — 〜つもりです", "goal": "앞으로의 계획을 말하고, 순서와 동시 동작을 표현한다.", "rows": [{"jp": "明日(あした)は 大阪城(おおさかじょう)に 行(い)く つもりです。", "ko": "내일은 오사카성에 갈 생각입니다."}, {"jp": "午後(ごご)は ゆっくり 休(やす)む つもりです。", "ko": "오후에는 천천히 쉴 생각입니다."}, {"jp": "買(か)い物(もの)してから、ご飯(はん)を 食(た)べる つもりです。", "ko": "쇼핑하고 나서 밥을 먹을 생각입니다."}, {"jp": "明日は 何(なに)を する つもりですか。", "ko": "내일은 무엇을 할 생각입니까?"}], "listen": [{"jp": "予定(よてい)は ありますか。", "ko": "일정이 있습니까?"}, {"jp": "もし よかったら、ご一緒(いっしょ)に どうですか。", "ko": "괜찮으시면 함께 어떠세요?"}], "s1md": "", "s2": "| 용도 | 형태 | 예문 |\n| --- | --- | --- |\n| 계획(의지) | 동사 기본형 + つもりです | 行く つもりです |\n| 계획 안 함 | 〜ない つもりです | 行かない つもりです |\n| 순서 | 〜て から | 食べて から 帰(かえ)ります |\n| 동시 | 〜ながら | 歩(ある)きながら 話(はな)します |\n\n- 「つもり」는 내가 마음먹은 계획, 「予定」은 정해진 일정입니다. 여행에서는 대부분 「つもりです」로 말하면 자연스럽고, 호텔 체크아웃처럼 정해진 것은 「予定です」를 씁니다.\n- 「〜ながら」는 같은 사람이 두 동작을 동시에 할 때만 씁니다. 앞 동작은 ます형 어간(歩く→歩き)에 붙입니다.", "s3": {"md": "**A. 빈칸 채우기**\n\n1. 明日は 大阪城に 行く( )です。\n2. 買い物して( )、ご飯を 食べます。\n3. 歩き( ) 話します。\n4. 明日は 何を する( )ですか。\n\n**B. 순서 맞추기**\n\n1. つもりです / 行く / 大阪城に / 明日は\n2. 食べる / ご飯を / つもりです / 買い物してから\n\n**C. 직접 쓰기 (2문장)**\n\n1. 내일 오사카성에 갈 생각이라고 말하기\n2. 오후에는 쉬고 싶다고(쉴 생각이라고) 말하기", "A": ["明日は 大阪城に 行く( )です。", "買い物して( )、ご飯を 食べます。", "歩き( ) 話します。", "明日は 何を する( )ですか。"], "B": ["つもりです / 行く / 大阪城に / 明日は", "食べる / ご飯を / つもりです / 買い物してから"], "C": ["내일 오사카성에 갈 생각이라고 말하기", "오후에는 쉬고 싶다고(쉴 생각이라고) 말하기"], "ans": {"A": {"1": "つもり", "2": "から", "3": "ながら", "4": "つもり"}, "B": {"1": "明日は 大阪城に 行く つもりです。", "2": "買い物してから、ご飯を 食べる つもりです。"}, "C": {"1": "明日は 大阪城に 行く つもりです。", "2": "午後は ゆっくり 休む つもりです。"}}}, "turns": [{"who": "スタッフ", "text": "明日の 予定は ありますか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "大阪城に 行く つもりです。", "scene": "", "sn": 0, "me": true}, {"who": "スタッフ", "text": "午後は 何を する つもりですか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "買い物してから、ゆっくり 休む つもりです。", "scene": "", "sn": 0, "me": true}, {"who": "スタッフ", "text": "いいですね。歩きながら 見(み)ると 楽(たの)しいですよ。", "scene": "", "sn": 0, "me": false}], "s4md": "**1) 따라 말하기** — 위 문형 4개와 듣기용 문장을 3번씩 읽습니다.\n\n**2) 바꿔 말하기** — 「  "2": "思ったより きれいで、感動しました。"}}}, "turns": [{"who": "スタッフ", "text": "今日(きょう)は どうでしたか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "思ったより きれいで、感動しました。", "scene": "", "sn": 0, "me": true}, {"who": "スタッフ", "text": "それは よかったですね。ご飯は 食べましたか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "はい、でも、高いのに おいしくなかったです。", "scene": "", "sn": 0, "me": true}, {"who": "スタッフ", "text": "それは 残念でしたね。", "scene": "", "sn": 0, "me": false}], "s4md": "**1) 따라 말하기** — 위 문형 4개와 듣기용 문장을 3번씩 읽습니다.\n\n**2) 바꿔 말하기** — 「\\_\\_\\_ のに、\\_\\_\\_ 。」\n\n高(たか)い·おいしくなかったです / 並(なら)んだ·買(か)えませんでした / 初(はじ)めてなの·懐(なつ)かしいです / 小(ちい)さい·おいしいです\n\n**3) 롤플레이** — 하루를 마치고 직원과 이야기하는 장면입니다.\n\n- **スタッフ**: 今日(きょう)は どうでしたか。\n- **あなた**: 思ったより きれいで、感動しました。\n- **スタッフ**: それは よかったですね。ご飯は 食べましたか。\n- **あなた**: はい、でも、高いのに おいしくなかったです。\n- **スタッフ**: それは 残念でしたね。", "s5": ["「〜のに」와 「〜けど」의 차이를 안다", "명사·な형용사 + なのに을 말할 수 있다", "롤플레이를 1번 녹음했다"], "s5md": "", "ans": "- A: 1. のに / 2. のに / 3. なのに / 4. より\n- B: 1. 高いのに、ラーメンは おいしくなかったです。 / 2. 思ったより きれいで、感動しました。\n- C 예시: 1. 高いのに、おいしくなかったです。 / 2. 思ったより きれいで、感動しました。"}, {"n": 49, "date": "12/24", "dow": "목", "title": "7주차 종합 — 문장 늘리기", "goal": "의견·추측·비교·경험·계획·감상을 한 번의 대화에서 이어 말한다.", "rows": [{"jp": "神戸(こうべ)の 夜景(やけい)が きれいだと 思(おも)います。", "ko": "고베의 야경이 아름답다고 생각합니다.", "tag": "Day 43"}, {"jp": "明日(あした)は 雨(あめ)が 降(ふ)るかもしれません。", "ko": "내일은 비가 올지도 모릅니다.", "tag": "Day 44"}, {"jp": "大阪(おおさか)より 神戸(こうべ)の ほうが 静(しず)かです。", "ko": "오사카보다 고베 쪽이 조용합니다.", "tag": "Day 45"}, {"jp": "買(か)い物(もの)したり、お寺(てら)を 見(み)たり しました。", "ko": "쇼핑하기도 하고 절을 보기도 했습니다.", "tag": "Day 46"}, {"jp": "明日は 大阪城(おおさかじょう)に 行(い)く つもりです。", "ko": "내일은 오사카성에 갈 생각입니다.", "tag": "Day 47"}, {"jp": "高(たか)いのに、おいしくなかったです。", "ko": "비싼데도 맛이 없었습니다.", "tag": "Day 48"}], "listen": [], "s1md": "", "s2": "| 패턴 | 형태 | 한국어 |\n| --- | --- | --- |\n| 의견 | 보통형 + と 思います | ~라고 생각합니다 |\n| 추측 | 보통형 + かもしれません | ~일지도 모릅니다 |\n| 비교 | Aより Bの ほうが | A보다 B가 |\n| 나열 | 〜たり 〜たり する | ~하기도 하고 ~하기도 한다 |\n| 계획 | 〜つもりです / 〜てから / 〜ながら | ~할 생각입니다 / ~하고 나서 / ~하면서 |\n| 역접 | 〜のに | ~인데도 |", "s3": {"md": "다음 문장을 일본어로 써 봅니다. 6문장을 모두 쓴 뒤 정답을 확인하세요.\n\n1. 이 가게가 좋다고 생각합니다.\n2. 내일은 비가 올지도 모릅니다.\n3. 버스보다 전철이 더 빠릅니다.\n4. 교토에서 쇼핑하기도 하고 절을 구경하기도 했습니다.\n5. 내일은 오사카성에 갈 생각입니다.\n6. 줄 섰는데도 사지 못했습니다.", "G": ["이 가게가 좋다고 생각합니다.", "내일은 비가 올지도 모릅니다.", "버스보다 전철이 더 빠릅니다.", "교토에서 쇼핑하기도 하고 절을 구경하기도 했습니다.", "내일은 오사카성에 갈 생각입니다.", "줄 섰는데도 사지 못했습니다."], "ans": {"G": {"1": "この お店は いいと 思います。", "2": "明日は 雨が 降るかもしれません。", "3": "バスより 電車の ほうが 速いです。", "4": "京都で 買い物したり、お寺を 見たり しました。", "5": "明日は 大阪城に 行く つもりです。", "6": "並んだのに、買えませんでした。"}}}, "turns": [{"who": "スタッフ", "text": "今日は どうでしたか。", "scene": "장면 1 · 오늘 이야기", "sn": 1, "me": false}, {"who": "あなた", "text": "買い物したり、お寺を 見たり しました。思ったより きれいで、感動しました。", "scene": "장면 1 · 오늘 이야기", "sn": 1, "me": true}, {"who": "スタッフ", "text": "神戸と 大阪と どちらが 好きですか。", "scene": "장면 2 · 비교·의견", "sn": 2, "me": false}, {"who": "あなた", "text": "大阪より 神戸の ほうが 静かだと 思います。", "scene": "장면 2 · 비교·의견", "sn": 2, "me": true}, {"who": "スタッフ", "text": "明日は 何を する つもりですか。", "scene": "장면 3 · 계획·추측", "sn": 3, "me": false}, {"who": "あなた", "text": "大阪城に 行く つもりです。雨が 降るかもしれませんが、朝に 行きます。", "scene": "장면 3 · 계획·추측", "sn": 3, "me": true}], "s4md": "**롤플레이** — 하루를 돌아보고 내일을 이야기하는 장면입니다. 나(あなた) 대사만 소리 내어 말하세요.\n\n장면 1 · 오늘 이야기\n\n- **スタッフ**: 今日は どうでしたか。\n- **あなた**: 買い物したり、お寺を 見たり しました。思ったより きれいで、感動しました。\n\n장면 2 · 비교·의견\n\n- **スタッフ**: 神戸と 大阪と どちらが 好きですか。\n- **あなた**: 大阪より 神戸の ほうが 静かだと 思います。\n\n장면 3 · 계획·추측\n\n- **スタッフ**: 明日は 何を する つもりですか。\n- **あなた**: 大阪城に 行く つもりです。雨が 降るかもしれませんが、朝に 行きます。\n\n처음부터 끝까지 한 번에 말하면서 녹음하고, 막힌 곳에 표시합니다.", "s5": ["번역 6문장 중 4문장 이상 맞혔다", "롤플레이를 막힘없이 1번 녹음했다", "막힌 문장을 표시해 두었다"], "s5md": "", "ans": "1. この お店は いいと 思います。\n2. 明日は 雨が 降るかもしれません。\n3. バスより 電車の ほうが 速いです。\n4. 京都で 買い物したり、お寺を 見たり しました。\n5. 明日は 大阪城に 行く つもりです。\n6. 並んだのに、買えませんでした。"}, {"n": 50, "date": "12/25", "dow": "금", "title": "분실·도난 — 〜を なくして しまいました", "goal": "물건을 잃어버렸을 때 무엇을, 언제, 어디서 잃었는지 말한다.", "rows": [{"jp": "財布(さいふ)を なくして しまいました。", "ko": "지갑을 잃어버렸습니다."}, {"jp": "スマホを 電車(でんしゃ)に 忘(わす)れました。", "ko": "스마트폰을 전철에 (きゅうきゅうしゃ)を 呼(よ)んで ください。", "ko": "구급차를 불러 주세요.", "tag": "Day 55"}], "listen": [], "s1md": "", "s2": "| 패턴 | 형태 | 한국어 |\n| --- | --- | --- |\n| 유감 | 〜て しまいました | ~해 버렸습니다 |\n| 수동(피해) | 〜られました | ~당했습니다 |\n| 증상 | 〜が 痛いです / 熱が あります | ~이 아픕니다 / 열이 있습니다 |\n| 부탁 | 〜て もらえますか / 〜て ください | ~해 주실 수 있습니까 / ~해 주세요 |\n| 감사 | 〜て くださって ありがとうございます | ~해 주셔서 감사합니다 |\n| 사과 | 〜て 申し訳ありません | ~해서 죄송합니다 |", "s3": {"md": "다음 문장을 일본어로 써 봅니다. 6문장을 모두 쓴 뒤 정답을 확인하세요.\n\n1. 가방을 전철에 두고 내렸습니다.\n2. 길을 잃었습니다. 지도에서 알려 주실 수 있습니까?\n3. 배가 아프고 속이 메스껍습니다.\n4. 한 번 더 천천히 말해 주실 수 있습니까?\n5. 구급차를 불러 주세요.\n6. 가르쳐 주셔서 감사합니다. 큰 도움이 됐습니다.", "G": ["가방을 전철에 두고 내렸습니다.", "길을 잃었습니다. 지도에서 알려 주실 수 있습니까?", "배가 아프고 속이 메스껍습니다.", "한 번 더 천천히 말해 주실 수 있습니까?", "구급차를 불러 주세요.", "가르쳐 주셔서 감사합니다. 큰 도움이 됐습니다."], "ans": {"G": {"1": "かばんを 電車に 忘れて しまいました。", "2": "道に 迷いました。地図で 教えて いただけますか。", "3": "おなかが 痛くて、気持ち悪いです。", "4": "もう 一度 ゆっくり 話して もらえますか。", "5": "救急車を 呼んで ください。", "6": "教えて くださって、ありがとうございます。助かりました。"}}}, "turns": [{"who": "警察官(けいさつかん)", "text": "どう しましたか。", "scene": "장면 1 · 분실", "sn": 1, "me": false}, {"who": "あなた", "text": "かばんを 電車に 忘れて しまいました。黒くて 大きい かばんです。", "scene": "장면 1 · 분실", "sn": 1, "me": true}, {"who": "警察官", "text": "駅(えき)の 遺失物(いしつぶつ)センターに 連絡しましょう。", "scene": "장면 2 · 못 알아들음", "sn": 2, "me": false}, {"who": "あなた", "text": "すみません、もう 一度 ゆっくり お願いします。ここに 書いて もらえますか。", "scene": "장면 2 · 못 알아들음", "sn": 2, "me": true}, {"who": "あなた", "text": "あの、頭が 痛くて、気持ち悪いです。近くに 病院は ありますか。", "scene": "장면 3 · 몸이 안 좋음", "sn": 3, "me": true}, {"who": "あなた", "text": "教えて くださって、ありがとうございます。本当(ほんとう)に 助かりました。", "scene": "장면 4 · 감사", "sn": 4, "me": true}], "s4md": "**롤플레이** — 곤란한 상황을 이어서 대처합니다. 나(あなた) 대사만 소리 내어 말하세요.\n\n장면 1 · 분실\n\n- **警察官(けいさつかん)**: どう しましたか。\n- **あなた**: かばんを 電車に 忘れて しまいました。黒くて 大きい かばんです。\n\n장면 2 · 못 알아들음\n\n- **警察官**: 駅(えき)の 遺失物(いしつぶつ)センターに 連絡しましょう。\n- **あなた**: すみません、もう 一度 ゆっくり お願いします。ここに 書いて もらえますか。\n\n장면 3 · 몸이 안 좋음\n\n- **あなた**: あの、頭が 痛くて、気持ち悪いです。近くに 病院は ありますか。\n\n장면 4 · 감사\n\n- **あなた**: 教えて くださって、ありがとうございます。本当(ほんとう)に 助かりました。\n\n처음부터 끝까지 한 번에 말하면서 녹음하고, 막힌 곳에 표시합니다.", "s5": ["번역 6문장 중 4문장 이상 맞혔다", "롤플레이를 막힘없이 1번 녹음했다", "막힌 문장을 표시해 두었다"], "s5md": "", "ans": "1. かばんを 電車に 忘れて しまいました。\n2. 道に 迷いました。地図で 教えて いただけますか。\n3. おなかが 痛くて、気持ち悪いです。\n4. もう 一度 ゆっくり 話して もらえますか。\n5. 救急車を 呼んで ください。\n6. 教えて くださって、ありがとうございます。助かりました。"}, {"n": 57, "date": "1/1", "dow": "금", "title": "자기소개 확장 — 직업·거주지·취미", "goal": "직업, 사는 곳, 취미, 동행을 이어서 소개한다.", "rows": [{"jp": "仕事(しごと)は ○○を して います。", "ko": "직업은 ○○를 하고 있습니다."}, {"jp": "ソウルに 住(す)んで います。", "ko": "서울에 살고 있습니다."}, {"jp": "趣味(しゅみ)は 旅行(りょこう)と 映画(えいが)です。", "ko": "취미는 여행과 영화입니다."}, {"jp": "友達(ともだち)と 二人(ふたり)で 来(き)ました。", "ko": "친구와 둘이서 왔습니다."}], "listen": [{"jp": "お仕事(しごと)は 何(なん)ですか。", "ko": "일은 무엇입니까?"}, {"jp": "どこに 住(す)んで いますか。", "ko": "어디에 삽니까?"}, {"jp": "ご趣味(しゅみ)は なんですか。", "ko": "취미는 무엇입니까?"}], "s1md": "", "s2": "| 용도 | 형태 | 예문 |\n| --- | --- | --- |\n| 직업 | 〜を して います / 〜です | 先生(せんせい)を して います |\n| 거주 | 〜に 住(す)んで います | ソウルに 住んで います |\n| 취미 | 趣味は 〜です | 趣味は 料理(りょうり)です |\n| 동행 | 〜と 〜人(にん)で | 友達と 二人で |\n\n- 직업은 「会社員(かいしゃいん)です」(회사원입니다)처럼 명사로 말하거나 「〜を して います」(~을 하고 있습니다)로 말합니다. 예) 学校(がっこう)で 数学(すうがく)を 教(おし)えて います.\n- 「住んで います」는 \"살고 있다\"는 상태를 나타내는 〜ている 표현입니다. 「住みます」라고 하면 \"(앞으로) 살겠다\"는 뜻이 되니 주의하세요.\n- 「〜人で」는 인원수를 나타내어 「一人(ひとり)で」(혼자서), 「二人で」(둘이서)처럼 씁니다.", "s3": {"md": "**A. 빈칸 채우기**\n\n1. ソウル( ) 住んで います。\n2. 趣味は 旅行( ) 映画です。\n3. 先生( ) して います。\n4. 一人( ) 来ました。\n\n**B. 순서 맞추기**\n\n1. 住んで / ソウルに / います\n2. 来ました / 二人で / 友達と\n\n**C. 직접 쓰기 (2문장)**\n\n1. 직업과 사는 곳을 한 번에 말하기\n2. 취미와 함께 온 사람을 말하기", "A": ["ソウル( ) 住んで います。", "趣味は 旅行( ) 映画です。", "先生( ) して います。", "一人( ) 来ました。"], "B": ["住んで / ソウルに / います", "来ました / 二人で / 友達と"], "C": ["직업과 사는 곳을 한 번에 말하기", "취미와 함께 온 사람을 말하기"], "ans": {"A": {"1": "に", "2": "と", "3": "を", "4": "で"}, "B": {"1": "ソウルに 住んで います。", "2": "友達と 二人で 来ました。"}, "C": {"1": "先生を して います。ソウルに 住んで います。", "2": "趣味は 旅行です。友達と 二人で 来ました。"}}}, "turns": [{"who": "スタッフ", "text": "お仕事は 何ですか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "○○を して います。ソウルに 住んで います。", "scene": "", "sn": 0, "me": true}, {"who": "スタッフ", "text": "そうですか。ご趣味は なんですか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "旅行と 映画です。", "scene": "", "sn": 0, "me": true}, {"who": "スタッフ", "text": "一人で 来ましたか。", "scene": "", "sn": 0, "me": false}, {"who": "あなた", "text": "いいえ、友達と 二人で 来ました。", "scene": "", "sn": 0, "me": true}], "s4md": "**1) 따라 말하기** — 위 문형 4개와 듣기용 문장을 3번씩 읽습니다.\n\n**2) 바꿔 말하기** — 「趣味は \\_\\_\\_ です。」\n\n旅行(りょこう) / 映画(えいが) / 料理(りょうり) / 運動(うんどう)\n\n**3) 롤플레이** — 게스트하우스에서 현지 사람과 자기소개를 나누는 장면입니다.\n\n- **スタッフ**: お仕事は 何ですか。\n- **あなた**: ○○を して います。ソウルに 住んで います。\n- **スタッフ**: そうですか。ご趣味は なんですか。\n- **あなた**: 旅行と 映画です。\n- **スタッフ**: 一人で 来ましたか。\n- **あなた**: いいえ、友達と 二人で 来ました。", "s5": ["「〜を して います」「〜に 住んで います」를 말할 수 있다", "내 직업을 일본어로 말할 수 있다", "롤플레이를 1번 녹음했다"], "s5md": "", "ans": "- A: 1. に / 2. と / 3. を / 4. で\n- B: 1. ソウルに 住んで います。 / 2. 友達と 二人で 来ました。\n- C 예시: 1. 先生を して います。ソウルに 住んで います。 / 2. 趣味は 旅行です。友達と 二人で 来ました。"}, {"n": 58, "date": "1/2", "dow": "토", "title": "한국 소개 — 〜と 言われて います", "goal": "한국의 이름난 것과 특징을 간단히 소개한다.", "rows": [{"jp": "韓国(かんこく)の 首都(しゅと)は ソウルです。", "ko": "한국의 수도는 서울입니다."}, {"jp": "辛(から)い ものが 多(おお)いと 言(い)われて います。", "ko": "매운 음식이 많다고들 합니다."}, {"jp": "冬(ふゆ)は とても 寒(さむ)いです。", "ko": "겨울은 매우 춥습니다."}, {"jp": "日本(にほん)から 飛行機(ひこうき)で 二時間(にじかん)ぐらいです。", "ko": "일본에서 비행기로 2시간쯤입니다."}], "listen": [{"jp": "韓国は どんな ところですか。", "ko": "한국은 어떤 곳입니까?"}, {"jp": "キムチは 有名(ゆうめい)ですよね。", "ko": "김치는 유명하죠."}, {"jp": "行(い)って みたいです。", "ko": "가 보고 싶습니다."}], "s1md": "", "s2": "| 용도 | 형태 | 예문 |\n| --- | --- | --- |\n| ~라고들 한다 | 보통형 + と 言われて います | 寒いと 言われて います |\n| ~로 유명하다 | 〜で 有名(ゆうめい)です | キムチで 有名です |\n| ~이 많다 | 〜が 多(おお)い | 観光客(かんこうきゃく)が 多いです |\n| 소요 | 〜で 〜ぐらい | 飛行機で 二時間ぐらい |\n\n- 「〜と 言われて います」는 \"일반적으로 ~라고 알려져 있다\"는 표현이며, 단정하지 않고 부드럽게 소개할 때 자주 씁니다.\n- 「どんな ところですか」(어떤 곳입니까?)는 지역을 소개해 달라는 질문입니다. 대답은 「〜が 有名です」 한 문장으로 충분합니다.", "s3": {"md": "**A. 빈칸 채우기**\n\n1. 韓国の 首都( ) ソウルです。\n2. 辛い ものが 多い( ) 言われて います。\n3. 飛行機( ) 二時間ぐらいです。\n4. キムチは 有名( )ね。\n\n**B. 순서 맞추기**\n\n1. 有名です / キムチが / 韓国は\n2. 二時間 / 飛行機で / ぐらいです\n t": "和食が 好きなんです。ありがとうございます。でも、まだまだです。", "scene": "장면 3 · 취향·맞장구", "sn": 3, "me": true}, {"who": "店主", "text": "これ、ほんま おいしいで。", "scene": "장면 4 · 간사이벤", "sn": 4, "me": false}, {"who": "あなた", "text": "めっちゃ おいしいです。おおきに！", "scene": "장면 4 · 간사이벤", "sn": 4, "me": true}], "s4md": "**롤플레이** — 현지 사람과의 자연스러운 대화입니다. 나(あなた) 대사만 소리 내어 말하세요.\n\n장면 1 · 자기소개\n\n- **スタッフ**: お仕事は 何ですか。どこに 住んで いますか。\n- **あなた**: ○○を して います。ソウルに 住んで います。\n\n장면 2 · 한국 소개\n\n- **スタッフ**: 韓国は どんな ところですか。\n- **あなた**: キムチで 有名です。冬は とても 寒いと 言われて います。\n\n장면 3 · 취향·맞장구\n\n- **スタッフ**: 何が 好きですか。日本語、お上手ですね。\n- **あなた**: 和食が 好きなんです。ありがとうございます。でも、まだまだです。\n\n장면 4 · 간사이벤\n\n- **店主**: これ、ほんま おいしいで。\n- **あなた**: めっちゃ おいしいです。おおきに！\n\n처음부터 끝까지 한 번에 말하면서 녹음하고, 막힌 곳에 표시합니다.", "s5": ["번역 6문장 중 4문장 이상 맞혔다", "롤플레이를 막힘없이 1번 녹음했다", "막힌 문장을 표시해 두었다"], "s5md": "", "ans": "1. ソウルに 住んで います。友達と 二人で 来ました。\n2. 韓国は キムチで 有名です。\n3. 次は 京都に 行って みたいです。\n4. 私は 歩くのが 好きです。\n5. 日本語、お上手ですね。— ありがとうございます。でも、まだまだです。\n6. めっちゃ おいしいです。おおきに！"}, {"n": 64, "date": "1/8", "dow": "금", "title": "실전 시뮬레이션 1 — 공항 → 호텔", "goal": "입국심사부터 체크인까지 힌트만 보고 일본어로 말한다.", "rows": [{"jp": "観光(かんこう)で 来(き)ました。十一日間(じゅういちにちかん) 滞在(たいざい)する 予定(よてい)です。", "ko": "관광으로 왔습니다. 11일 체류할 예정입니다.", "tag": "입국심사"}, {"jp": "大阪行(おおさかゆ)きの 電車(でんしゃ)は 何番線(なんばんせん)ですか。", "ko": "오사카행 전철은 몇 번선입니까?", "tag": "전철"}, {"jp": "ICOCAに 三千円(さんぜんえん)、チャージしたいんですが。", "ko": "ICOCA에 3천 엔 충전하고 싶은데요.", "tag": "교통카드"}, {"jp": "この 電車は 大阪に 止(と)まりますか。", "ko": "이 전철은 오사카에 섭니까?", "tag": "환승"}, {"jp": "予約(よやく)した ○○です。チェックインを お願(ねが)いします。", "ko": "예약한 ○○입니다. 체크인 부탁합니다.", "tag": "체크인"}, {"jp": "朝食(ちょうしょく)は 何時(なんじ)からですか。", "ko": "조식은 몇 시부터입니까?", "tag": "조식"}], "listen": [], "s1md": "이번 주부터는 새 문형 없이 지금까지 배운 문장을 장면별로 다시 꺼냅니다. 소리 내어 읽어 보세요.", "s2": "- 장면이 바뀌어도 쓰는 틀은 같습니다. 「〜は どこですか」「〜たいんですが」「〜ても いいですか」「〜て もらえますか」 네 가지가 대부분을 해결합니다.\n- 막히면 짧게 시작하세요. 「すみません、〜」 다음에 핵심 단어만 말해도 직원은 알아듣습니다.\n- 못 알아들으면 「もう 一度 お願いします」로 되묻는 것을 두려워하지 마세요.", "s3": {"md": "다음 문장을 일본어로 써 봅니다. 6문장을 모두 쓴 뒤 정답을 확인하세요.\n\n1. 관광으로 왔습니다. 11일 체류할 예정입니다.\n2. 오사카행 전철은 몇 번선입니까?\n3. ICOCA에 3천 엔 충전하고 싶은데요.\n4. 이 전철은 오사카에 섭니까?\n5. 예약한 ○○입니다. 체크인 부탁합니다.\n6. 조식은 몇 시부터입니까?", "G": ["관광으로 왔습니다. 11일 체류할 예정입니다.", "오사카행 전철은 몇 번선입니까?", "ICOCA에 3천 엔 충전하고 싶은데요.", "이 전철은 오사카에 섭니까?", "예약한 ○○입니다. 체크인 부탁합니다.", "조식은 몇 시부터입니까?"], "ans": {"G": {"1": "観光で 来ました。十一日間 滞在する 予定です。", "2": "大阪行きの 電車は 何番線ですか。", "3": "ICOCAに 三千円 チャージしたいんですが。", "4": "この 電車は 大阪に 止まりますか。", "5": "予約した ○○です。チェックインを お願いします。", "6": "朝食は 何時からですか。"}}}, "turns": [{"who": "審査官(しんさかん)", "text": "入国の 目的は 何ですか。何日間 滞在しますか。", "scene": "장면 1 · 입국심사", "sn": 1, "me": false}, {"who": "あなた", "text": "観光です。十一日間 滞在します。", "scene": "장면 1 · 입국심사", "sn": 1, "me": true, "hint": "관광으로 왔고 11일 체류합니다", "alt": ["観光です。十一日間 滞在します。"]}, {"who": "係員(かかりいん)", "text": "どちらまで ですか。", "scene": "장면 2 · 공항 역", "sn": 2, "me": false}, {"who": "あなた", "text": "大阪駅まで どう 行けば いいですか。", "scene": "장면 2 · 공항 역", "sn": 2, "me": true, "hint": "오사카역까지 어떻게 가면 되는지 묻기", "alt": ["大阪駅まで どう 行けば いいですか。", "ICOCAに 三千円 チャージしたいんですが。"]}, {"who": "係員", "text": "大阪行きの 関空快速が 便利です。二番線から 出ます。", "scene": "장면 2 · 공항 역", "sn": 2, "me": false}, {"who": "あなた", "text": "大阪駅まで どう 行けば いいですか。 ICOCAに 三千円 チャージしたいんですが。", "scene": "장면 2 · 공항 역", "sn": 2, "me": true, "hint": "ICOCA에 3천 엔 충전하고 싶다고 말하기", "alt": ["大阪駅まで どう 行けば いいですか。", "ICOCAに 三千円 チャージしたいんですが。"]}, {"who": "フロント", "text": "いらっしゃいませ。", "scene": "장면 3 · 호텔", "sn": 3, "me": false}, {"who": "あなた", "text": "予約した ○○です。チェックインを お願いします。朝食は 何時からですか。", "scene": "장면 3 · 호텔", "sn": 3, "me": true, "hint": "예약한 ○○라고 말하고 체크인 부탁하기, 조식 시간 묻기", "alt": ["予約した ○○です。チェックインを お願いします。朝食は 何時からですか。"]}, {"who": "フロント", "text": "朝食は 七時からです。お部屋は 五階です。", "scene": "장면 3 · 호텔", "sn": 3, "me": false}], "s4md": "**롤플레이** — 직원 대사는 읽고, 나(あなた) 대사는 한국어 힌트를 보고 일본어로 직접 말합니다. 막히면 정답에서 확인하세요.\n\n장면 1 · 입국심사\n\n- **審査官(しんさかん)**: 入国の 目的は 何ですか。何日間 滞在しますか。\n- **あなた**: (관광으로 왔고 11일 체류합니다)\n\n장면 2 · 공항 역\n\n- **係員(かかりいん)**: どちらまで ですか。\n- **あなた**: (오사카역까지 어떻게 가면 되는지 묻기)\n- **係員**: 大阪行きの 関空快速が 便利です。二番線から 出ます。\n- **あなた**: (ICOCA에 3천 엔 충전하고 싶다고 말하기)\n\n장면 3 · 호텔\n\n- **フロント**: いらっしゃいませ。\n- **あなた**: (예약한 ○○라고 말하고 체크인 부탁하기, 조식 시간 묻기)\n- **フロント**: 朝食は 七時からです。お部屋は 五階です。\n\n한 번 더 한국어 힌트만 보고 말하면서 녹음합니다.", "s5": ["번역 6문장 중 5문장 이상 맞혔다", "롤플레이를 정답을 보지 않고 1번 말했다", "막힌 문장을 표시해 두었다"], "s5md": "", "ans": "작문\n\n1. 観光で 来ました。十一日間 滞在する 予定です。\n2. 大阪行きの 電車は 何番線ですか。\n3. ICOCAに 三千円 チャージしたいんですが。\n4. この 電車は 大阪に 止まりますか。\n5. 予約した ○○です。チェックインを お願いします。\n6. 朝食は 何時からですか。\n\n롤플레이 모범 대사\n\n- 장면 1: 観光です。十一日間 滞在します。\n- 장면 2: 大阪駅まで どう 行けば いいですか。 / ICOCAに 三千円 チャージしたいんですが。\n- 장면 3: 予約した ○○です。チェックインを お願いします。朝食は 何時からですか。"}, {"n": 65, "date": "1/9", "dow": "토", "title": "실전 시뮬레이션 2 — 식당", "goal": "입장부터 계산까지 힌트만 보고 말한다.", "rows": [{"jp": "予約(よやく)していませんが、二人(ふたり) 入(はい)れますか。", "ko": "예약은 안 했는데 두 명 들어갈 수 있습니까?", "tag": "입장"}, {"jp": "あっさりした ものが いいんですが、おすすめは ありますか。", "ko": "담백한 것이 좋은데 추천이 있습니까?", "tag": "상담"}, {"jp": "ご飯(はん)は 少(すく)なめで お願(ねが)いします。", "ko": "밥은 적게 부탁합니다.", "tag": "조절"}, {"jp": "えびの アレルギーが あります。卵(たまご)は 入(はい)って いますか。", "ko": "새우 알레르기가 있습니다. 달걀은 들어 있습니까?", "tag": "알레르기"}, {"jp": "水(みず)を もう 一(ひと)つ お願(ねが)いします。", "ko": "물을 하나 더 부탁합니다.", "tag": "추가"}, {"jp": "別々(べつべつ)に カードで 払(はら)えますか。", "ko": "따로따로 카드로 낼 수 있습니까?", "tag": "계산"}], "listen": [], "s1md": "", "s2": "- 주문의 핵심은 「〜を ください」와 「〜に します」입니다. 메뉴 이름만 알면 문장이 완성됩니다.\n- 못 먹는 것은 「アレルギーが あります」 (심각), 「苦手(にがて)です」 (싫어함)로 구별해서 말합니다.\n- 계산할 때 「カードで 払えますか」를 먼저 물어보면 현금만 받는 가게에서도 당황하지 않습니다.", "s3": {"md": "1. 예약은 안 했는데 두 명 들어갈 수 있습니까?\n2. 담백한 것이 좋은데 추천이 있습니까?\n3. 밥은 적게 부탁합니다.\n4. 새우 알레르기가 있습니다. 이 요리에 들어 있습니까?\n5. 물을 하나 더 부탁합니다.\n6. 따로따로 카드로 낼 수 있습니까?", "G": ["예약은 안 했는데 두 명 들어갈 수 있습니까?", "담백한 것이 좋은데 추천이 있습니까?", "밥은 적게 부탁합니다.", "새우 알레르기가 있습니다. 이 요리에 들어 있습니까?", "물을 하나 더 부탁합니다.", "따로따로 카드로 낼 수 있습니까?"], "ans": {"G": {"1": "予約は していませんが、二人 入れますか。", "2": "あっさりした ものが いいんですが、おすすめは ありますか。", "3": "ご飯は 少なめで お願いします。", "4": "えびの アレルギーが あります。この 料理に えびは 入って いますか。", "5": "水を もう 一つ お願いします。", "6": "別々に カードで 払えますか。"}}}, "turns": [{"who": "店員(てんいん)", "text": "いらっしゃいませ。何名様(なんめいさま)ですか。", "scene": "장면 1 · 입장", "sn": 1, "me": false}, {"who": "あなた /* ---------- text helpers ---------- */
const RB=/([一-龥々]+)\(([ぁ-んァ-ヶー・/]+)\)/g;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rb=s=>esc(s).replace(RB,'<ruby>$1<rt>$2</rt></ruby>').replace(/\\_/g,'_');
const kana=s=>s.replace(RB,(m,a,b)=>b.split('/')[0]);
const kanji=s=>s.replace(RB,'$1');
function inl(s){return rb(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function md(src){
  const blocks=src.replace(/\r/g,'').split(/\n\s*\n/);let out='';
  for(const b of blocks){const L=b.split('\n').filter(x=>x.trim()!=='');if(!L.length)continue;
    if(L.every(l=>l.trim().startsWith('|'))){
      const rows=L.map(l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
      const head=rows[0],body=rows.slice(2);
      out+='<div class="tw"><table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
    }else if(L.every(l=>/^\s*- /.test(l))){out+='<ul>'+L.map(l=>'<li>'+inl(l.replace(/^\s*- /,''))+'</li>').join('')+'</ul>'}
    else if(L.every(l=>/^\d+\.\s/.test(l))){out+='<ol>'+L.map(l=>'<li>'+inl(l.replace(/^\d+\.\s/,''))+'</li>').join('')+'</ol>'}
    else out+='<p>'+L.map(inl).join('<br>')+'</p>';}
  return '<div class="md">'+out+'</div>';
}
const KN='一二三四五六七八九';
function kanNum(s){return s.replace(/[一二三四五六七八九十百千万]+/g,m=>{
  if(!/[十百千万]/.test(m)&&m.length>1&&!/^[一二三四五六七八九]+$/.test(m))return m;
  let tot=0,cur=0,big=0;for(const c of m){const i=KN.indexOf(c);
    if(i>=0)cur=i+1;else if(c==='十'){tot+=(cur||1)*10;cur=0}else if(c==='百'){tot+=(cur||1)*100;cur=0}else if(c==='千'){tot+=(cur||1)*1000;cur=0}else if(c==='万'){tot=(tot+cur||1)*10000;cur=0}}
  return String(tot+cur)})}
function normCh(c){c=c.normalize('NFKC');if(/[ァ-ヶ]/.test(c))c=String.fromCharCode(c.charCodeAt(0)-0x60);
  if(/[\s。、，．,.!?！？「」『』〜~…・\-ー−"'“”()（）\[\]:：;；\/／○〇◯_]/.test(c))return '';return c.toLowerCase()}
function normStr(s){return [...kanNum(s.normalize('NFKC'))].map(normCh).join('')}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function sim(a,b){const x=normStr(a),y=normStr(b);if(!x||!y)return 0;return 1-lev(x,y)/Math.max(x.length,y.length)}
function variants(jp){
  const alts=[jp];if(/\s[\/／]\s/.test(jp))jp.split(/\s[\/／]\s/).forEach(x=>alts.push(x));
  const v=[];alts.forEach(a=>{v.push(kana(a));v.push(kanji(a))});return [...new Set(v)];
}
function diffHtml(target,heard){
  const t=[...kanNum(target.normalize('NFKC'))];const tn=t.map(normCh);const h=[...normStr(heard)];
  const idx=[];tn.forEach((c,i)=>{if(c)idx.push(i)});const a=idx.map(i=>tn[i]);
  const m=a.length,n=h.length;const D=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)D[i][j]=a[i]===h[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const ok=new Set();let i=0,j=0;while(i<m&&j<n){if(a[i]===h[j]){ok.add(idx[i]);i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
  return t.map((c,k)=>tn[k]===''||ok.has(k)?esc(c):'<span class="miss">'+esc(c)+'</span>').join('');
}

function pickVoice(){if(!voices.length)return null;
  if(S.set.voice){const v=voices.find(v=>v.voiceURI===S.set.voice);if(v)return v}
  const pref=[/Kyoko/i,/O-?Ren/i,/Nanami/i,/Google.*日本語|Google.*Japanese/i,/Haruka/i,/Ayumi/i];
  for(const p of pref){const v=voices.find(v=>p.test(v.name));if(v)return v}return voices[0]}
function ttsText(jp){return kana(jp).replace(/[○〇]+/g,'なにか').replace(/〜/g,'').replace(/\s[\/／]\s/g,'。').replace(/ICOCA/g,'イコカ')}
let ttsToken=0;
function speak(jp,opts={}){return new Promise(res=>{

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function newRec(){const r=new SR();r.lang='ja-JP';r.interimResults=true;r.maxAlternatives=5;r.continuous=false;r._run=false;r._log=[];r._t0=Date.now();
  EVS.forEach(n=>r.addEventListener(n,()=>{r._log.push(n+'@'+(Date.now()-r._t0));if(n==='start')r._run=true;if(n==='end')r._run=false}));
  recObj=r;return r}
function stopRec(){if(recObj){try{recObj.abort()}catch(e){}}if(recCb){const f=recCb;recCb=null;f({aborted:true})}}
function finishRec(){if(recObj){try{recObj.stop()}catch(e){}}}
async function waitEnd(r,ms){const t=Date.now();while(r._run&&Date.now()-t<ms)await sleep(40)}
function listen(onInterim){return new Promise(async res=>{
  if(recCb){const f=recCb;recCb=null;f({aborted:true})}

  if(old){old.onresult=old.onerror=old.onend=null;if(old._run){try{old.abort()}catch(e){}await waitEnd(old,1000)}}

  const fin=o=>{if(done)return;done=true;clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);r.onresult=r.onerror=r.onend=null;recCb=null;o.log=r._log.join(' ');res(o);if(r._run)setTimeout(()=>{try{r.stop()}catch(e){}},0)};
  recCb=fin;
  r.onresult=e=>{const R=e.results[e.results.length-1];last=R[0].transcript;r._log.push('result'+(R.isFinal?'(final)':'')+'@'+(Date.now()-r._t0));

    const alts=[];for(let i=0;i<R.length;i++)alts.push(R[i].transcript);fin({alts})};
  r.onerror=e=>{const c=e.error||'error';if(c==='no-speech'||c==='aborted'){fin(last?{alts:[last]}:{error:'no-speech'})}else fin({error:c})};
  r.onend=()=>fin(last?{alts:[last]}:{error:'no-speech'});
  t1=setTimeout(finishRec,9000);
  t3=setTimeout(()=>{try{r.abort()}catch(e){}fin(last?{alts:[last]}:{error:'stuck'})},11500);

  let h='<div class="card"><div class="sh"><h2>⑤ 자기점검</h2></div>';
  const rows=D.rows.length;let ok=0;D.rows.forEach((r,i)=>{const b=bestOf(D.n,'r'+i);if(b!=null&&b>=PASS)ok++});
  if(rows)h+=`<div class="res info" style="margin-bottom:10px">문형 마이크 점검: <b>${ok} / ${rows}</b>문장이 75% 이상${ok<rows?' · ① 문형 탭에서 남은 문장을 말해 보세요':''}<div class="sbar" style="margin-top:6px"><i style="width:${rows?ok/rows*100:0}%"></i></div></div>`;
  {const m=S.w['mc'+D.n];if(m)h+=`<div class="res info" style="margin-bottom:10px">작문 객관식: <b>${m.c} / ${m.t}</b> 정답 (${m.d}문제 풀이)</div>`}
  if(D.turns.some(t=>t.me))h+=`<div class="res info" style="margin-bottom:10px">롤플레이: ${S.checks[D.n+':rp']?'끝까지 마쳤습니다':'아직 끝까지 하지 않았습니다'}</div>`;
  D.s5.forEach((t,i)=>{const k=D.n+':'+i;h+=`<label class="chk"><input type="checkbox" data-chk="${k}" ${S.checks[k]?'checked':''}><span>${inl(t)}</span></label>`});
  if(D.s5md)h+=md(D.s5md);
  h+=`<div class="cta" style="margin-top:14px"><button class="btn ${S.done[D.n]?'':'pri'}" data-act="done">${S.done[D.n]?'완료 취소':'오늘 학습 완료'}</button></div></div>`;
  return h;
}
function wirePane(D){
  const pane=document.getElementById('pane');
  if(V.step===3){wirePaneW(D);wireMc(D)}
  pane.addEventListener('change',e=>{const c=e.target.closest('[data-chk]');if(c){S.checks[c.dataset.chk]=c.checked;save()}});
}
/* global events */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const t=g.dataset.go;if(t==='day')go('day',+g.dataset.n,1);else go(t);return}
  const st=e.target.closest('[data-step]');
  if(st){stopAudio();V.step=+st.dataset.step;render();window.scrollTo(0,0);return}
  const kt=e.target.closest('[data-kt]');if(kt)kt.classList.toggle('show');
  const wm=e.target.closest('[data-wmode]');if(wm){S.set.wmode=wm.dataset.wmode;save();render();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act;const row=b.closest('[data-id]');
  if(act==='play'||act==='slow'){const r=REG[row.dataset.id];if(r)speak(r.jp,act==='slow'?{rate:.6}:{})}
  else if(act==='mic'){if(b.closest('#chat'))return;const r=REG[row.dataset.id];if(r)doMic(b,row,r.jp,+row.dataset.n,row.dataset.id)}
  else if(act==='seq'){if(V.step!==4){V.step=4;render()}const D=DATA[V.n-1];runSeq(D,document.getElementById('seqbox'));document.getElementById('seqbox').scrollIntoView({block:'center',behavior:'smooth'})}
  else if(act==='rp'){runRP(DATA[V.n-1]);document.getElementById('chat').scrollIntoView({block:'start',behavior:'smooth'})}
  else if(act==='quiz'){runQuiz(DATA[V.n-1],b.dataset.mode)}
  else if(act==='done'){const n=V.n;S.done[n]=!S.done[n];save();render()}
});
/* ---------- REVIEW ---------- */
function renderReview(){
  REG={};const items=Object.entries(S.best).filter(([k,v])=>v.s<PASS).sort((a,b)=>a[1].s-b[1].s);
  let h='<section class="dayhead"><h1>복습</h1><p class="goal">75% 미만이었던 문장입니다. 75%를 넘기면 목록에서 사라집니다.</p></section><div class="card">';
  if(!items.length)h+='<p class="muted">복습할 문장이 없습니다. 문형에서 말하기를 시도하면 여기에 모입니다.</p>';
  items.forEach(([k,v])=>{const n=+k.split(':')[0];const id=k.split(':')[1];const rid='v'+k.replace(':','_');reg(rid,v.jp,v.ko);
    h+=`<div class="prow" data-n="${n}" data-id="${rid}" data-orig="${id}"><div class="ptag">Day ${n} · 최고 ${Math.round(v.s*100)}%</div><div class="pjp">${rb(v.jp)}</div>${v.ko?`<div class="pko"><span class="kt" data-kt>${esc(v.ko)}</span></div>`:''}<div class="acts"><button class="btn" data-act="play">${IC.play}듣기</button><button class="btn" data-act="slow">${IC.slow}천천히</button><button class="btn rec" data-act="mic">${IC.mic}말하기</button></div><div class="res" hidden></div></div>`});
  h+='</div><div class="pager"><button class="btn" data-go="home">노선도</button></div>';
  app.innerHTML=h;
}
function render(){applySet();if(V.name==='home')renderHome();else if(V.name==='day')renderDay();else renderReview()}
/* review rows save under original id */
const _setBest=setBest;
setBest=function(n,id,s,jp,ko){if(/^v\d+_/.test(id)){id=id.replace(/^v\d+_/,'')}return _setBest(n,id,s,jp,ko)};
/* init */
(function(){try{const tv=localStorage.getItem(KEY+':theme');if(tv)setTheme(tv)}catch(e){}
  const m=location.hash.match(/^#day(\d+)$/);if(m&&DATA[+m[1]-1])V={name:'day',n:+m[1],step:1};
  render()})();
</script>
